<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a2f">
<title>El cuaderno helado de Mia</title>
<style>
  :root{
    --noche:#071a2f;
    --hielo:#0e2b49;
    --hielo2:#14395f;
    --brillo:#8fe3ff;
    --aurora:#7ef0c9;
    --malva:#c9a7ff;
    --nieve:#f2f8ff;
    --papel:#fdf8ec;
    --tinta:#2b3a4a;
    --sol:#ffd479;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--noche);color:var(--nieve);
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(126,240,201,.16), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(201,167,255,.14), transparent 60%),
      linear-gradient(180deg,#071a2f 0%, #0b2340 55%, #103055 100%);
    background-attachment:fixed;
  }
  #app{max-width:560px;margin:0 auto;padding:18px 16px 40px;}
  h1,h2,h3{margin:0 0 10px; font-weight:700; letter-spacing:.5px;}
  h1{font-size:30px; line-height:1.15;}
  h2{font-size:23px;}
  p{font-size:19px; line-height:1.5; margin:0 0 14px; max-width:34em;}
  .sub{color:var(--brillo); font-size:16px;}
  button{font-family:inherit;}
  .btn{
    display:block; width:100%; min-height:58px; margin:10px 0;
    border:none; border-radius:16px; padding:16px 18px;
    font-size:20px; font-weight:700; color:#062033;
    background:linear-gradient(180deg,#bff0ff,#7fd6f7);
    box-shadow:0 6px 0 #3d8fb5; cursor:pointer;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 3px 0 #3d8fb5;}
  .btn.sec{background:linear-gradient(180deg,#22507d,#183f66); color:var(--nieve); box-shadow:0 6px 0 #0c2743;}
  .btn.ghost{background:transparent; color:var(--brillo); box-shadow:none; border:2px solid #2f5f8c; min-height:48px; font-size:17px;}
  .btn:focus-visible{outline:3px solid var(--sol); outline-offset:3px;}
  .fila{display:flex; gap:10px; align-items:center;}
  .fila .btn{margin:10px 0;}
  .tarjeta{
    background:linear-gradient(180deg, rgba(20,57,95,.95), rgba(11,35,62,.95));
    border:1px solid #2b5a86; border-radius:20px; padding:18px; margin:14px 0;
  }
  .globo{
    position:relative; background:var(--papel); color:var(--tinta);
    border-radius:18px; padding:16px 18px; font-size:19px; line-height:1.45;
  }
  .globo:after{content:""; position:absolute; left:26px; bottom:-12px; border:12px solid transparent; border-top-color:var(--papel); border-bottom:0;}
  .quien{display:flex; align-items:flex-end; gap:12px; margin:6px 0 18px;}
  .quien .cara{width:74px; height:74px; flex:0 0 74px;}
  .quien .dice{flex:1;}
  .nombre{font-size:15px; color:var(--brillo); margin:8px 0 0 6px;}
  .modelo{background:var(--papel); border-radius:18px; padding:12px; margin:12px 0;
    box-shadow:inset 0 0 0 3px #e6dcc4;}
  .modelo svg{display:block; width:100%; height:auto;}
  .paso{display:flex; gap:12px; align-items:flex-start; margin:12px 0; font-size:19px; line-height:1.45;}
  .num{flex:0 0 34px; height:34px; border-radius:50%; background:var(--brillo); color:#062033;
    font-weight:800; display:flex; align-items:center; justify-content:center; font-size:18px;}
  .mats{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 4px;}
  .mat{background:#12395f; border:1px solid #2f6d9e; border-radius:999px; padding:8px 14px; font-size:16px;}
  .barra{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .copos{font-size:18px; color:var(--sol);}
  .op{display:block; width:100%; text-align:left; min-height:56px; margin:9px 0;
    background:#14395f; color:var(--nieve); border:2px solid #2f6d9e; border-radius:14px;
    padding:14px 16px; font-size:20px; cursor:pointer;}
  .op:active{background:#1c4c7a;}
  .op.bien{background:#1c6b52; border-color:var(--aurora);}
  .op.mal{background:#6b2b3a; border-color:#ff9db0;}
  .op:focus-visible{outline:3px solid var(--sol); outline-offset:2px;}
  .marca{display:flex; gap:12px; align-items:center; width:100%; text-align:left;
    background:#14395f; color:var(--nieve); border:2px solid #2f6d9e; border-radius:14px;
    padding:14px 16px; font-size:18px; margin:9px 0; cursor:pointer; min-height:56px;}
  .caja{flex:0 0 30px; height:30px; border-radius:8px; border:2px solid var(--brillo); display:flex;
    align-items:center; justify-content:center; font-size:20px; color:#062033;}
  .marca.si .caja{background:var(--aurora);}
  .aviso{background:#123a5e; border-left:5px solid var(--brillo); border-radius:0 12px 12px 0;
    padding:12px 14px; font-size:18px; line-height:1.45; margin:12px 0;}
  .lista-mis{margin:0; padding:0; list-style:none;}
  .mis{display:flex; gap:12px; align-items:center; width:100%; text-align:left; margin:10px 0;
    background:linear-gradient(180deg,#173f66,#102e4e); border:1px solid #2f6d9e; color:var(--nieve);
    border-radius:16px; padding:14px; font-size:18px; cursor:pointer; min-height:64px;}
  .mis .ins{flex:0 0 40px; height:40px; border-radius:12px; background:#0a2440; display:flex;
    align-items:center; justify-content:center; font-size:20px;}
  .mis.hecha{border-color:var(--aurora);}
  .pie{margin-top:26px; text-align:center; color:#6f9dc4; font-size:14px;}
  .ref-top{position:sticky; top:0; z-index:5; background:rgba(7,26,47,.92); padding:8px 0 10px;
    backdrop-filter:blur(4px);}
  .grande{font-size:22px;}
  .oculto{display:none;}
  /* ====== HORIZONTAL (Echo Show, tablets acostadas) ====== */
  @media (orientation:landscape){
    #app{max-width:1100px;padding:14px 24px 28px}
    p{max-width:none}
    .rutas{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .lista-mis{display:grid;grid-template-columns:1fr 1fr;column-gap:14px}
    .lista-mis .mis{height:calc(100% - 20px)}
    .dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
    .dos .izq{position:sticky;top:8px}
    .dos .modelo svg{max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);margin:0 auto}
    .ops{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
  }
  /* Pantallas bajas: Echo Show 5 (960 x 480) */
  @media (orientation:landscape) and (max-height:620px){
    h1{font-size:26px} h2{font-size:20px}
    p,.paso,.globo,.aviso{font-size:17px}
    .btn{min-height:50px;padding:11px 16px;font-size:18px;margin:8px 0}
    .op,.marca{min-height:50px;padding:10px 14px;font-size:18px;margin:7px 0}
    .tarjeta{padding:14px;margin:10px 0}
    .quien .cara{width:60px;height:60px;flex-basis:60px}
  }
  @media (prefers-reduced-motion:no-preference){
    .aparece{animation:sube .28s ease-out;}
    @keyframes sube{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  }
</style>
</head>
<body>
<div id="app"></div>

const MESES = [
  {n:1,  n1:"enero",      dias:31},

const MISIONES = [
/* ---------------- RUTA 1: LOS MESES DEL AÑO ---------------- */
{
  id:"A1", ruta:"anio", personaje:"aura",
  titulo:"La lista de los doce meses",

  preguntas:[
    {q:"Mira tu cuaderno. ¿Qué mes escribiste en el número 7?",

     pista:"Busca octubre en tu hoja y mira el número que le pusiste delante."},
    {q:"¿Cuál es el último mes de tu lista?",
     ops:["noviembre","diciembre","enero","doce"], ok:1,
     bien:"Miraste el final de tu lista para responder.",
     pista:"Mira la última línea que escribiste, la del número 12."}
  ],
  checklist:[
    "Escribí los 12 meses.",
    "Empecé por enero y terminé en diciembre.",
    "Cada mes tiene su número delante."
  ],
  cierre:"Tu lista queda guardada en el cuaderno. La vas a usar en las próximas misiones, así que no arranques la hoja."
},
{
  id:"A2", ruta:"anio", personaje:"elina",
  titulo:"La rueda del año",
  meta:"Dibujar un círculo partido en 12 y escribir un mes en cada parte.",

  modelo:"rueda",
  modeloPasos:[

  instrucciones:[

  preguntas:[

  ],
  checklist:[
    "Usé cuatro colores distintos.",
    "Cada color ocupa exactamente 3 casillas.",

  ],
  cierre:"Acabas de partir el año en cuatro partes iguales. Eso también son fracciones: en la otra ruta las vas a dibujar."
},
{
  id:"A4", ruta:"anio", personaje:"kristo",
  titulo:"Los días de cada mes",
  meta:"Escribir una tabla con los días que tiene cada mes.",
  saludo:"Para cargar el trineo necesito saber cuántos días dura cada mes. No todos duran lo mismo, y hay un truco con los nudillos de la mano.",
  materiales:["Cuaderno","Lápiz","Tu mano cerrada"],
  modelo:"nudillos",
  modeloPasos:[
    "Cierra el puño y mira los nudillos y los huecos entre ellos.",
    "Empieza en el primer nudillo: enero. El hueco de al lado: febrero. El siguiente nudillo: marzo.",
    "Los meses que caen en nudillo tienen 31 días. Los que caen en hueco tienen 30, menos febrero, que tiene 28.",
    "Cuando llegues al último nudillo con julio, vuelve a empezar por el primero con agosto."
  ],
  instrucciones:[
    "Haz dos columnas: mes y días.",
    "Escribe los 12 meses en la primera columna.",
    "Usa los nudillos y escribe al lado 31, 30 o 28.",

    "Cuenta cuántos rodeaste y escríbelo abajo."

  preguntas:[

     ops:["28","29","30","31"], ok:2,
     bien:"Buscaste el mes en tu tabla en vez de adivinar.",
     pista:"Busca noviembre en tu columna y lee el número de al lado."},
    {q:"¿Qué mes escribiste con 28 días?",

    {q:"¿Cuántos meses rodeaste con 31 días?",

  checklist:[
    "Mi tabla tiene los 12 meses.",
    "Cada mes tiene su número de días al lado.",
    "Rodeé los meses de 31 días."
  ],
  cierre:"Si sumas todos los días de tu tabla te sale el año entero: 365. Puedes intentarlo otro día con la calculadora."
},
{
  id:"A5", ruta:"anio", personaje:"elina",

  meta:"Colocar cuatro fiestas del reino en la rueda del año.",

  preguntas:[

/* ---------------- RUTA 2: FRACCIONES ---------------- */
{

const Guardado = (function(){

  let memoria={};
  let hayDisco=true;
  try{ const t=window.localStorage.getItem(clave); memoria = t?JSON.parse(t):{}; }
  catch(e){ hayDisco=false; memoria={}; }
  return {
    dato(){ return memoria; },
    set(k,v){ memoria[k]=v; if(hayDisco){ try{ localStorage.setItem(clave, JSON.stringify(memoria)); }catch(e){} } }
  };
})();

/* ================= voz ================= */
let vozES=null;
function cargarVoz(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices()||[];
  vozES = vs.find(v=>/^es[-_]ES/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){
  cargarVoz();
  speechSynthesis.onvoiceschanged = cargarVoz;
}
let colaVoz=[];
function callar(){
  colaVoz=[];
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
function hablar(textos){
  if(!S.voz || !("speechSynthesis" in window)) return;
  callar();
  colaVoz = (Array.isArray(textos)?textos:[textos]).filter(t=>t && String(t).trim().length);
  siguienteVoz();
}
function siguienteVoz(){
  if(!colaVoz.length) return;
  const t = colaVoz.shift();
  const u = new SpeechSynthesisUtterance(limpiar(t));
  u.lang = vozES ? vozES.lang : "es-ES";
  if(vozES) u.voice = vozES;
  u.rate = 0.95; u.pitch = 1.05;
  u.onend = siguienteVoz;
  u.onerror = siguienteVoz;
  speechSynthesis.speak(u);
}
function limpiar(t){
  return String(t)
    .replace(/(\d+)\s*\/\s*(\d+)/g, function(_,a,b){ return a+" partido en "+b; })
    .replace(/…/g,".")
    .replace(/\s+/g," ")
    .trim();
}

function coloresEstacion(i){ return ["#bfe6ff","#c9f2d6","#ffe0a8","#f3ccd8"][Math.floor(i/3)]; }

function ruedaSVG(pintar){
  let g='';
  for(let i=0;i<12;i++){
    const a0=(i*30-90)*Math.PI/180, a1=((i+1)*30-90)*Math.PI/180;
    const x0=110+95*Math.cos(a0), y0=110+95*Math.sin(a0);
    const x1=110+95*Math.cos(a1), y1=110+95*Math.sin(a1);
    const relleno = pintar ? coloresEstacion(i) : "#ffffff";
    g += '<path d="M110 110 L'+x0.toFixed(1)+' '+y0.toFixed(1)+' A95 95 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z" fill="'+relleno+'" stroke="#8aa3bb" stroke-width="1.6"/>';
    const am=((i+0.5)*30-90)*Math.PI/180;
    const tx=110+64*Math.cos(am), ty=110+64*Math.sin(am);
    g += '<text x="'+tx.toFixed(1)+'" y="'+(ty+4).toFixed(1)+'" font-size="13" text-anchor="middle" fill="#2b3a4a" font-family="Verdana,sans-serif">'+MESES[i].n1.slice(0,3)+'</text>';
  }
  return '<svg viewBox="0 0 220 230" role="img" aria-label="Rueda del año con doce casillas">'+g+
    '<text x="110" y="226" font-size="12" text-anchor="middle" fill="#6b7a8a" font-family="Verdana,sans-serif">enero arriba, sigue hacia la derecha</text></svg>';
}

}

/* ================= utilidades de render ================= */
const app = document.getElementById("app");
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* Ningún dibujo se corta: si algo se sale del marco, el marco crece hasta abarcarlo. */
function ajustarDibujos(raiz){
  Array.prototype.forEach.call(raiz.querySelectorAll(".modelo svg"), function(s){
    try{
      const vb=s.viewBox.baseVal, bb=s.getBBox(), m=6;
      const x0=Math.min(vb.x, bb.x-m), y0=Math.min(vb.y, bb.y-m);
      const x1=Math.max(vb.x+vb.width, bb.x+bb.width+m), y1=Math.max(vb.y+vb.height, bb.y+bb.height+m);
      s.setAttribute("viewBox", [x0,y0,x1-x0,y1-y0].map(function(n){ return Math.round(n*10)/10; }).join(" "));
    }catch(e){}
  });
}
function pinta(html, decir){
  app.innerHTML = '<div class="aparece">'+html+'</div>';
  ajustarDibujos(app);
  window.scrollTo(0,0);
  if(decir) hablar(decir);
}
function botonesVoz(){
  return '<div class="fila" style="gap:8px">'+
   '<button class="btn ghost" id="bRep">Repetir audio</button>'+
   '<button class="btn ghost" id="bVoz">'+(S.voz?"Silenciar":"Activar voz")+'</button></div>';
}
function conectaVoz(decir){
  const r=document.getElementById("bRep"); if(r) r.onclick=function(){ hablar(decir); };
  const v=document.getElementById("bVoz"); if(v) v.onclick=function(){
    S.voz=!S.voz; Guardado.set("voz",S.voz); if(!S.voz) callar(); render();
  };
}
function totalCopos(){ return Object.keys(S.hechas).length; }
function misionesDe(ruta){ return MISIONES.filter(function(m){ return m.ruta===ruta; }); }
function dialogo(pj, texto){
  return '<div class="quien">'+cara(pj)+'<div class="dice"><div class="globo">'+esc(texto)+'</div></div></div>'+
   '<div class="nombre">'+esc(NOMBRES[pj])+'</div>';
}

/* ================= pantallas ================= */

  if(S.vista==="mapa") return vistaMapa();
  if(S.vista==="mision") return vistaMision();
}

function vistaMapa(){
  mantenerPantalla(false);
  const lista = misionesDe(S.ruta);
  const titulo = S.ruta==="anio" ? "Ruta del año" : "Ruta del hielo";
  const intro = S.ruta==="anio"
    ? "Seis misiones para conocer los meses del año y hacer tu propio calendario."
    : "Seis misiones para partir, pintar y escribir fracciones en tu cuaderno.";
  let html='<div class="barra"><button class="btn ghost" style="width:auto;padding:10px 16px" id="volver">Volver</button>'+
    '<span class="copos">❄ '+totalCopos()+'</span></div>'+
    '<h2>'+titulo+'</h2><p>'+esc(intro)+'</p><ul class="lista-mis">';
  lista.forEach(function(m,i){

      '<span class="ins">'+(hecha?"❄":(i+1))+'</span>'+

  });
  html+='</ul>';

    b.onclick=function(){
      S.mision = MISIONES.find(function(m){ return m.id===b.dataset.id; });
      S.paso=0; S.preg=0; S.intentos=0; S.perfectas=true;
      S.marcadas = S.mision.checklist.map(function(){ return false; });
      S.vista="mision"; render();
    };

/* pasos internos de una misión */
function pasosMision(m){
  const p = [{t:"portada"}];
  m.modeloPasos.forEach(function(_,i){ p.push({t:"modelo", i:i}); });
  p.push({t:"hacer"});
  m.preguntas.forEach(function(_,i){ p.push({t:"pregunta", i:i}); });
  p.push({t:"check"});
  p.push({t:"fin"});
  return p;
}

function vistaMision(){
  const m = S.mision;
  const pasos = pasosMision(m);
  const paso = pasos[S.paso];
  mantenerPantalla(paso.t==="hacer");

  const cabecera = '<div class="barra">'+
    '<button class="btn ghost" style="width:auto;padding:10px 16px" id="salir">Salir</button>'+
    '<span class="sub">'+esc(m.titulo)+'</span></div>';

  if(paso.t==="portada"){
    const decir=[m.saludo, "Lo que vas a hacer: "+m.meta, "Prepara: "+m.materiales.join(", ")+"."];
    pinta(cabecera+'<div class="dos"><div class="izq">'+dialogo(m.personaje, m.saludo)+'</div><div class="der">'+
      '<div class="tarjeta"><h3>Lo que vas a hacer</h3><p>'+esc(m.meta)+'</p>'+
      '<div class="mats">'+m.materiales.map(function(x){return '<span class="mat">'+esc(x)+'</span>';}).join("")+'</div></div>'+
      '<button class="btn" id="sig">Ver el modelo</button>'+botonesVoz()+'</div></div>', decir);
    document.getElementById("sig").onclick=avanzar;
  }
  else if(paso.t==="modelo"){
    const texto = m.modeloPasos[paso.i];
    const svg = MODELOS[m.modelo] ? MODELOS[m.modelo]() : "";
    const ultimo = paso.i === m.modeloPasos.length-1;
    pinta(cabecera+
      '<div class="dos"><div class="izq"><div class="modelo">'+svg+'</div></div><div class="der">'+
      '<div class="paso"><span class="num">'+(paso.i+1)+'</span><span>'+esc(texto)+'</span></div>'+
      '<button class="btn" id="sig">'+(ultimo?"Ya lo entiendo, a mi cuaderno":"Siguiente")+'</button>'+
      (paso.i>0?'<button class="btn ghost" id="atras">Atrás</button>':'')+
      botonesVoz()+'</div></div>', [texto]);
    document.getElementById("sig").onclick=avanzar;
    const a=document.getElementById("atras"); if(a) a.onclick=retroceder;
  }
  else if(paso.t==="hacer"){
    const svg = MODELOS[m.modelo] ? MODELOS[m.modelo]() : "";
    const decir = ["Ahora en tu cuaderno."].concat(m.instrucciones).concat(["Cuando termines, toca ya lo hice. Tómate el tiempo que quieras."]);
    pinta(cabecera+
      '<div class="ref-top"><h2>Ahora en tu cuaderno</h2></div>'+
      '<div class="dos"><div class="izq"><div class="modelo">'+svg+'</div></div><div class="der">'+
      m.instrucciones.map(function(t,i){
        return '<div class="paso"><span class="num">'+(i+1)+'</span><span>'+esc(t)+'</span></div>';
      }).join("")+
      '<div class="aviso">Sin prisa. La pantalla se queda aquí todo el tiempo que necesites.</div>'+
      '<button class="btn" id="sig">Ya lo hice</button>'+
      '<button class="btn ghost" id="atras">Ver otra vez la explicación</button>'+
      botonesVoz()+'</div></div>', decir);
    document.getElementById("sig").onclick=avanzar;
    document.getElementById("atras").onclick=function(){ S.paso = 1; render(); };
  }
  else if(paso.t==="pregunta"){
    const q = m.preguntas[paso.i];
    const decir=["Pregunta "+(paso.i+1)+" de "+m.preguntas.length+".", q.q].concat(q.ops);
    let html = cabecera+'<h2>Mira tu cuaderno</h2>'+
      '<p class="grande">'+esc(q.q)+'</p>';
    html += '<div class="ops">';
    q.ops.forEach(function(o,i){ html += '<button class="op" data-i="'+i+'">'+esc(o)+'</button>'; });
    html += '</div>';
    html += '<div id="fb"></div>'+botonesVoz();
    pinta(html, decir);
    Array.prototype.forEach.call(document.querySelectorAll(".op"), function(b){
      b.onclick=function(){ responder(q, parseInt(b.dataset.i,10), b); };
    });
  }
  else if(paso.t==="check"){
    let html = cabecera+'<h2>Revisa tu página</h2>'+
      '<p>Marca lo que ya está en tu cuaderno. Si falta algo, todavía puedes añadirlo.</p>';
    m.checklist.forEach(function(t,i){
      html += '<button class="marca'+(S.marcadas[i]?" si":"")+'" data-i="'+i+'"><span class="caja">'+(S.marcadas[i]?"✓":"")+'</span><span>'+esc(t)+'</span></button>';
    });
    html += '<button class="btn" id="sig">Terminar la misión</button>'+botonesVoz();
    const decir=["Revisa tu página.","Marca lo que ya está en tu cuaderno. Si falta algo, todavía puedes añadirlo."].concat(m.checklist);
    pinta(html, decir);
    Array.prototype.forEach.call(document.querySelectorAll(".marca"), function(b){
      b.onclick=function(){ const i=parseInt(b.dataset.i,10); S.marcadas[i]=!S.marcadas[i]; render(); };
    });
    document.getElementById("sig").onclick=avanzar;
  }
  else if(paso.t==="fin"){
    S.hechas[m.id]=true; Guardado.set("hechas", S.hechas);
    const elogio = S.perfectas
      ? "Respondiste todo mirando tu cuaderno en vez de adivinar. Ese es el método que funciona."
      : "Cuando algo no salió, volviste al dibujo y lo comprobaste. Así es como se aprende.";
    const decir=["Misión terminada.", elogio, m.cierre];
    pinta(cabecera+
      '<h1>❄ Misión terminada</h1>'+
      '<div class="dos"><div class="izq">'+dialogo(m.personaje, m.cierre)+'</div><div class="der">'+
      '<div class="aviso">'+esc(elogio)+'</div>'+
      '<button class="btn" id="mapa">Volver a las misiones</button>'+
      '<button class="btn ghost" id="otra">Repetir esta misión</button>'+
      botonesVoz()+'</div></div>', decir);
    document.getElementById("mapa").onclick=function(){ S.vista="mapa"; render(); };
    document.getElementById("otra").onclick=function(){
      S.paso=0; S.perfectas=true; S.marcadas=m.checklist.map(function(){return false;}); render();
    };
  }

  const sal=document.getElementById("salir");
  if(sal) sal.onclick=function(){ S.vista="mapa"; render(); };
}

function responder(q, i, boton){
  const fb=document.getElementById("fb");
  const ok = (i===q.ok);
  if(ok){
    boton.classList.add("bien");
    fb.innerHTML='<div class="aviso">'+esc(q.bien)+'</div><button class="btn" id="sig">Seguir</button>';
    hablar([q.bien]);
  } else {
    S.perfectas=false;
    boton.classList.add("mal");
    S.intentos++;
    if(S.intentos<2){
      fb.innerHTML='<div class="aviso">'+esc(q.pista)+'</div>';
      hablar([q.pista]);
      return;
    }
    const correcta = q.ops[q.ok];
    fb.innerHTML='<div class="aviso">La respuesta es: '+esc(correcta)+'. '+esc(q.pista)+'</div>'+
      '<button class="btn" id="sig">Seguir</button>';
    hablar(["La respuesta es "+correcta+".", q.pista]);
    const b=document.querySelectorAll(".op")[q.ok]; if(b) b.classList.add("bien");
  }
  Array.prototype.forEach.call(document.querySelectorAll(".op"), function(b){ b.disabled=true; });
  const s=document.getElementById("sig");
  if(s) s.onclick=function(){ S.intentos=0; avanzar(); };
}

function avanzar(){
  const pasos = pasosMision(S.mision);
  if(S.paso < pasos.length-1){ S.paso++; render(); }
}
function retroceder(){ if(S.paso>0){ S.paso--; render(); } }

/* arranque */
render();
document.addEventListener("visibilitychange", function(){ if(document.hidden) callar(); });
</script>
</body>
