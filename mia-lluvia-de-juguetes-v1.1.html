<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La lluvia de juguetes de Mia</title>
<style>
:root{
  --tinta:#1f2a44; --suave:#5b6785; --papel:#fffaf0; --borde:#e7dcc6;
  --acento:#ff7a59; --acento2:#2f9e8f; --oro:#f5b301; --malo:#c94f4f;
  --sombra:0 4px 0 rgba(31,42,68,.18);
  --letra:Verdana,"Trebuchet MS","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#20304f;font-family:var(--letra);color:var(--tinta);overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:var(--papel)}
.pantalla{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.pantalla.activa{display:flex}
.fondo{position:absolute;inset:0;z-index:0}
.fondo svg{width:100%;height:100%;display:block}
.capa{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;min-height:0}
h1{font-size:30px;margin:0 0 6px;line-height:1.25;text-align:center}
h2{font-size:22px;margin:0 0 10px;line-height:1.3;text-align:center}
.btn{font-family:var(--letra);font-size:20px;font-weight:bold;border:0;border-radius:18px;padding:14px 22px;
  background:var(--acento);color:#fff;box-shadow:var(--sombra);cursor:pointer;min-height:56px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(31,42,68,.18)}
.btn.sec{background:#fff;color:var(--tinta);border:3px solid var(--borde)}
.btn.verde{background:var(--acento2)}
.btn:disabled{opacity:.45;pointer-events:none}
.centro{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;padding:20px 16px}
.pie{font-size:13px;color:var(--suave);text-align:center;padding:8px}

/* Menú */
#s-menu .titulo{background:rgba(255,255,255,.88);border-radius:24px;padding:18px 18px 12px;box-shadow:var(--sombra);max-width:440px}
#s-menu .sub{font-size:16px;line-height:1.6;text-align:center;margin:0;color:var(--suave)}

/* Personajes */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:100%;max-width:470px}
.carta{background:#fff;border:4px solid var(--borde);border-radius:20px;padding:8px 6px 10px;display:flex;flex-direction:column;
  align-items:center;gap:4px;cursor:pointer;box-shadow:var(--sombra);font-family:var(--letra);font-size:16px;color:var(--tinta);font-weight:bold}
.carta svg{width:96px;height:112px}
.carta.sel{border-color:var(--acento);background:#fff1ec}
.desplazable{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Mapa */
.mapa{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:470px}
.nivelbtn{font-family:var(--letra);border:0;border-radius:18px;padding:12px 10px;background:#fff;box-shadow:var(--sombra);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;color:var(--tinta);cursor:pointer;min-height:96px}
.nivelbtn .num{font-size:24px;font-weight:bold}
.nivelbtn .est{font-size:18px;letter-spacing:2px;color:var(--oro)}
.nivelbtn.bloq{opacity:.45;pointer-events:none}
.nivelbtn.hecho{background:#eaf7f3}

/* Diálogo de la guía */
#dialogo{position:absolute;left:0;right:0;bottom:0;z-index:50;display:none;padding:12px 12px 16px;
  background:linear-gradient(transparent,rgba(31,42,68,.35) 30%)}
#dialogo.ver{display:block}
.burbuja{display:flex;gap:10px;align-items:flex-end;max-width:540px;margin:0 auto}
.burbuja .guia{flex:0 0 84px;width:84px;height:110px}
.globo-texto{flex:1;background:#fff;border:3px solid var(--borde);border-radius:20px;padding:14px 16px 12px;box-shadow:var(--sombra)}
.globo-texto .quien{font-size:13px;font-weight:bold;color:var(--acento2);margin-bottom:4px}
.globo-texto p{margin:0;font-size:19px;line-height:1.7}
.globo-texto .acciones{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.btn.chico{font-size:17px;min-height:48px;padding:10px 16px}

/* Elegir objeto */
.objetos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;width:100%;max-width:470px}
.objcarta{background:#fff;border:4px solid var(--borde);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;
  font-family:var(--letra);font-size:15px;font-weight:bold;color:var(--tinta);cursor:pointer;box-shadow:var(--sombra);line-height:1.3}
.objcarta svg{width:64px;height:64px}

/* Juego */
#area{position:absolute;inset:0;z-index:2;touch-action:none;overflow:hidden}
.cae{position:absolute;left:0;top:0;will-change:transform;cursor:pointer}
.cae svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.cae.mal svg{filter:grayscale(1) opacity(.55)}
.cae.mal{animation:temblor .3s}
@keyframes temblor{0%,100%{margin-left:0}25%{margin-left:-8px}75%{margin-left:8px}}
.vuela{position:absolute;z-index:6;pointer-events:none;transition:transform .45s ease-in,opacity .45s ease-in}
#barra{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:rgba(255,255,255,.88);box-shadow:0 2px 6px rgba(0,0,0,.15)}
#barra .busca{display:flex;gap:8px;flex:1;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--acento);border-radius:14px;padding:2px 8px;font-size:15px;font-weight:bold}
.chip svg{width:34px;height:34px}
.chip .tag{background:var(--tinta);color:#fff;border-radius:8px;padding:0 6px;font-size:15px}
#pausa{width:52px;height:52px;border-radius:14px;border:0;background:var(--tinta);color:#fff;font-size:22px;font-family:var(--letra)}
#jugador{position:absolute;left:8px;bottom:6px;z-index:5;width:150px;height:150px;pointer-events:none}
#jugador .pj{position:absolute;left:0;bottom:22px;width:88px;height:108px}
#cesta{position:absolute;left:52px;bottom:0;width:96px;height:72px}
#cesta .etq{position:absolute;left:50%;top:30px;transform:translateX(-50%);background:var(--tinta);color:#fff;font-weight:bold;
  border-radius:10px;padding:1px 8px;font-size:17px;display:flex;gap:4px;align-items:center;white-space:nowrap}
#cesta .etq svg{width:22px;height:22px}
#cuenta3{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;font-size:110px;font-weight:bold;color:#fff;
  text-shadow:0 6px 0 rgba(0,0,0,.25)}
#velo{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(31,42,68,.6)}

/* Pregunta */
.tarjeta{background:rgba(255,255,255,.94);border-radius:22px;padding:16px;box-shadow:var(--sombra);width:100%;max-width:470px}
.pregunta{font-size:21px;line-height:1.6;text-align:center;margin:0 0 8px}
.visor{font-size:46px;font-weight:bold;text-align:center;min-height:66px;border:4px dashed var(--borde);border-radius:18px;margin:6px auto 12px;
  width:150px;line-height:58px;background:#fff}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.tecla{font-family:var(--letra);font-size:28px;font-weight:bold;border:0;border-radius:16px;min-height:64px;background:#fff;box-shadow:var(--sombra);
  border:3px solid var(--borde);color:var(--tinta);cursor:pointer}
.tecla.ok{background:var(--acento2);color:#fff;border-color:var(--acento2);font-size:20px}
.tecla.borra{font-size:20px}
.icono-preg{display:flex;justify-content:center}
.icono-preg svg{width:72px;height:72px}

/* Re-enseñanza */
.filas{display:flex;flex-direction:column;gap:6px;align-items:center;margin:8px 0}
.fila{display:flex;gap:4px;align-items:center}
.fila .it{width:46px;height:46px;border-radius:10px;padding:2px;transition:background .2s,transform .2s}
.fila .it svg{width:100%;height:100%}
.fila .it.luz{background:#ffe9a8;transform:scale(1.12)}
.caja-inicio{display:flex;align-items:center;gap:6px;background:var(--tinta);color:#fff;border-radius:14px;padding:6px 12px;font-size:22px;font-weight:bold}
.caja-inicio svg{width:34px;height:34px}
.caja-inicio.luz{background:var(--acento)}
.dicho{font-size:30px;font-weight:bold;text-align:center;min-height:44px;color:var(--acento)}

/* Resultado */
.estrellas{font-size:44px;letter-spacing:6px;color:var(--oro);text-align:center}
.estrellas .vacia{color:#d9d2c1}

/* ====== HORIZONTAL (Echo Show, tablets acostadas) ====== */
@media (orientation:landscape){
  #app{max-width:none}
  .rejilla{grid-template-columns:repeat(5,1fr);max-width:900px}
  .mapa{grid-template-columns:repeat(5,1fr);max-width:900px}
  .objetos{grid-template-columns:repeat(5,1fr);max-width:820px}
  .tarjeta{max-width:860px}
  .burbuja{max-width:900px}
  #t-pregunta{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
  #res-centro{flex-direction:row;flex-wrap:wrap}
  #res-centro .tarjeta{flex:0 0 100%;max-width:560px}
}
/* Pantallas bajas: Echo Show 5 (960 x 480) */
@media (orientation:landscape) and (max-height:620px){
  h1{font-size:26px} h2{font-size:19px;margin-bottom:6px}
  .centro{gap:10px;padding:10px 16px}
  .btn{font-size:18px;min-height:50px;padding:10px 18px}
  .carta{padding:6px 4px 8px;font-size:14px;line-height:1.3}
  .carta svg{width:70px;height:82px}
  .nivelbtn{min-height:76px;padding:8px 6px;font-size:15px}
  .nivelbtn .num{font-size:20px}
  .objcarta svg{width:56px;height:56px}
  #dialogo{padding:8px 10px 10px}
  .burbuja .guia{flex-basis:64px;width:64px;height:86px}
  .globo-texto{padding:10px 14px 10px}
  .globo-texto p{font-size:18px;line-height:1.6}
  .globo-texto .acciones{margin-top:6px}
  #barra{padding:5px 10px}
  #pausa{width:46px;height:46px}
  .chip svg{width:30px;height:30px}
  #jugador{transform:scale(.82);transform-origin:left bottom}
  .tarjeta{padding:12px 16px}
  .pregunta{font-size:20px;margin-bottom:4px}
  .icono-preg svg{width:56px;height:56px}
  .visor{font-size:40px;min-height:58px;line-height:50px;margin:4px auto 0}
  .teclado{gap:8px}
  .tecla{min-height:62px;font-size:26px}
  .fila .it{width:42px;height:42px}
  .estrellas{font-size:36px}
}
</style>
</head>

let actx = null;
function tono(f, dur, tipo, vol){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = tipo || "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(vol || .18, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

/* ============ VOZ ============
   Cola única: una frase empieza solo cuando la anterior terminó. Nunca se corta ni se silencia. */
const registroVoz = [];
let colaVoz = Promise.resolve();
let vozEs = null;
function elegirVoz(){
  if(!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  vozEs = vs.find(v => /^es[-_](419|MX|US|PE|CO|AR|CL)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }
function hablarYa(texto){
  return new Promise(res => {
    const reg = {texto, inicio: performance.now(), fin: null};
    registroVoz.push(reg);
    let hecho = false;
    const cerrar = () => { if(hecho) return; hecho = true; reg.fin = performance.now(); res(); };
    const estimado = Math.max(900, texto.length * 62);
    if(!("speechSynthesis" in window) || !vozEs && speechSynthesis.getVoices().length === 0){
      setTimeout(cerrar, estimado / ESCALA()); return;
    }
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = vozEs ? vozEs.lang : "es-ES"; if(vozEs) u.voice = vozEs;
    u.rate = .92; u.pitch = 1.05;
    u.onend = cerrar; u.onerror = cerrar;
    /* Red de seguridad solo para teléfonos que nunca avisan el final: espera el doble del tiempo estimado. */
    setTimeout(cerrar, (estimado * 2 + 2500) / ESCALA());
    speechSynthesis.speak(u);
  });
}
function hablar(texto){ colaVoz = colaVoz.then(() => hablarYa(texto)); return colaVoz; }

/* Cada fondo recibe ids propios: un degradado definido en una pantalla oculta no se pinta en otra. */
let fondoN = 0;
const horizontal = () => window.matchMedia("(orientation: landscape)").matches;
function escena(amb, quitarUnicos){
  const suf = "_" + (++fondoN);
  let svg = FONDOS[amb].replace(/id="(g\w)"/g, `id="$1${suf}"`).replace(/url\(#(g\w)\)/g, `url(#$1${suf})`);
  if(quitarUnicos) svg = svg.replace(/<[^>]*class="u"[^>]*\/>/g, "");
  return svg;
}
/* En horizontal el paisaje se extiende: tres tramos (el del medio en espejo); sol, luna y planeta salen una sola vez. */
function pintarFondo(el, amb){
  el.dataset.amb = amb;
  if(!horizontal()){
    el.innerHTML = `<svg viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice">${escena(amb, false)}</svg>`;
    return;
  }
  el.innerHTML = `<svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMax slice">` +
    `<g transform="translate(800,0) scale(-1,1)">${escena(amb, true)}</g>` +
    `<g transform="translate(800,0)">${escena(amb, true)}</g>` +
    `<g>${escena(amb, false)}</g></svg>`;  /* el tramo original va encima: sus figuras grandes pueden salirse de su tramo */
}
window.matchMedia("(orientation: landscape)").addEventListener("change", () => {
  document.querySelectorAll(".fondo[data-amb]").forEach(el => pintarFondo(el, el.dataset.amb));
});
document.querySelectorAll("[data-fondo]").forEach(el => pintarFondo(el, el.dataset.fondo));

function desbloqueado(n){ return n === 1 || !!(estado.niveles[n-1] && estado.niveles[n-1].superado); }
function pantallaMapa(){
  const m = $("#mapa"); m.innerHTML = "";
  NIVELES.forEach(L => {
    const info = estado.niveles[L.n] || {};
    const b = document.createElement("button");
    b.className = "nivelbtn" + (desbloqueado(L.n) ? "" : " bloq") + (info.superado ? " hecho" : "");
    b.dataset.nivel = L.n;
    const est = info.estrellas || 0;
    b.innerHTML = `<span class="num">${L.n}</span><span>${L.nombre}</span><span class="est">${"★".repeat(est)}${"☆".repeat(L.metas - est)}</span>`;
    b.onclick = () => empezarNivel(L.n);
    m.appendChild(b);
  });
  ir("s-mapa");
}
$("#b-jugar").onclick = () => { if(!estado.personaje) pantallaPersonajes(); else pantallaMapa(); };
$("#b-cambiar").onclick = pantallaPersonajes;
$("#b-mapa-menu").onclick = () => ir("s-menu");
$("#version").textContent = "Versión " + VERSION;

/* ============ PREPARAR NIVEL ============ */
let nivel = null;     // configuración
let ronda = null;     // datos de esta ronda
async function empezarNivel(n){
  nivel = NIVELES[n-1];
  ["#f-elegir","#f-juego","#f-pregunta","#f-resultado"].forEach(s => pintarFondo($(s), nivel.amb));
  ronda = {metas:[], plan:[], atrapadas:{}, malas:0, inicio:{}, respuestas:[]};
  ir("s-juego"); limpiarArea(); $("#busca").innerHTML = ""; $("#cesta-etq").innerHTML = "";
  $("#jugador-use").setAttribute("href", "#p-" + (estado.personaje || "mia"));
  await guia(INTROS[n]);
  if(nivel.elige){
    const id = await elegirObjeto();
    ronda.metas = [id];
  } else {
    ronda.metas = escogerMetas();
  }
  // Números iniciales de la canasta (contar desde cualquier número)
  ronda.metas.forEach((id, i) => {
    const r = nivel.inicios[i];
    ronda.inicio[id] = r ? azar(r[0], r[1]) : 0;
    ronda.atrapadas[id] = 0;
  });
  ronda.plan = armarPlan();
  ir("s-juego");
  pintarBusqueda();
  await guia(textoEncargo());
  await cuentaAtras();
  await lluvia();
  await preguntas();
}

function escogerMetas(){
  // Repetición espaciada: lo que se contó mal vuelve a salir como meta
  const pend = (estado.repaso[nivel.n] || []).filter(id => nivel.objs.includes(id));
  const resto = mezclar(nivel.objs.filter(id => !pend.includes(id)));
  return pend.concat(resto).slice(0, nivel.metas);
}

function elegirObjeto(){
  return new Promise(res => {
    const r = $("#rej-objetos"); r.innerHTML = "";
    const pend = (estado.repaso[nivel.n] || []).filter(id => nivel.objs.includes(id));
    nivel.objs.forEach(id => {
      const b = document.createElement("button");
      b.className = "objcarta"; b.dataset.obj = id;
      b.innerHTML = ico(id) + `<span>${OBJ[id].p}</span>`;
      b.onclick = () => res(id);
      r.appendChild(b);
    });
    // Si hay repaso pendiente, la guía lo recomienda (no lo impone); se muestra y se dice igual
    const aviso = $("#aviso-repaso");
    if(pend.length){
      aviso.textContent = "Te recomiendo practicar otra vez con " + OBJ[pend[0]].p + ".";
      aviso.style.display = "";
      r.querySelector(`[data-obj="${pend[0]}"]`).style.borderColor = "var(--acento)";
    } else aviso.style.display = "none";
    ir("s-elegir");
    if(pend.length) hablar(aviso.textContent);
  });
}

function textoEncargo(){
  const frases = ronda.metas.map(id => {
    const ini = ronda.inicio[id];
    return ini
      ? `Atrapa ${OBJ[id].p}. En tu canasta ya hay ${ini}, así que sigue contando desde ${ini}.`
      : `Atrapa ${OBJ[id].p}.`;
  });
  return frases.join(" ") + " Las demás cosas déjalas caer.";
}
function hay(id, n, palabra){
  if(n === 1) return OBJ[id].g === "f" ? "es una" : "es uno";
  return "son " + (palabra ? NUMS[n] : n);
}

function pintarBusqueda(){
  $("#busca").innerHTML = ronda.metas.map(id => {
    const ini = ronda.inicio[id];
    return `<span class="chip" data-meta="${id}">${ico(id)}${ini ? `<span class="tag">${ini}</span>` : ""}</span>`;
  }).join("");
  $("#cesta-etq").innerHTML = ronda.metas.filter(id => ronda.inicio[id]).map(id =>
    `<span class="etq" style="top:${30 + 0}px">${ico(id)}${ronda.inicio[id]}</span>`).join("");
  // Si hay dos etiquetas, se apilan
  const etqs = $("#cesta-etq").querySelectorAll(".etq");
  etqs.forEach((e, i) => { e.style.top = (etqs.length > 1 ? 14 + i * 28 : 30) + "px"; });
}

function armarPlan(){
  const lista = [];
  ronda.metas.forEach(id => { const c = azar(nivel.rango[0], nivel.rango[1]); for(let i=0;i<c;i++) lista.push(id); });
  const otros = nivel.objs.filter(id => !ronda.metas.includes(id));
  for(let i=0;i<nivel.distractores;i++) lista.push(otros[i % otros.length]);
  const orden = mezclar(lista);
  // Carriles: 5 columnas; nunca el mismo carril dos veces seguidas
  let ultimo = -1;
  return orden.map((id, i) => {
    let carril; do { carril = azar(0, 4); } while(carril === ultimo);
    ultimo = carril;
    return {id, t: i * nivel.intervalo + .4, carril, meta: ronda.metas.includes(id)};
  });
}

function cuentaAtras(){
  return new Promise(async res => {
    const c = $("#cuenta3"); c.style.display = "flex";
    for(const n of ["3","2","1"]){ c.textContent = n; sTic(); await espera(700); }
    c.style.display = "none"; res();
  });
}

/* ============ LLUVIA ============ */
let activos = [], enPausa = false, rafId = null, relojLluvia = 0;
function limpiarArea(){ $("#area").innerHTML = ""; activos = []; }
function medidas(){
  const a = $("#area").getBoundingClientRect();
  const tam = Math.max(66, Math.min(84, Math.floor(a.width / 5) - 6));
  return {w: a.width, h: a.height, tam, top: $("#barra").offsetHeight};
}
function lluvia(){
  return new Promise(res => {
    limpiarArea(); enPausa = false; relojLluvia = 0;
    const M = medidas();
    const anchoCarril = M.w / 5;
    let siguiente = 0, previo = performance.now();
    const total = ronda.plan.length;
    let terminados = 0;
    function crear(item){
      const el = document.createElement("div");
      el.className = "cae"; el.dataset.obj = item.id; el.dataset.meta = item.meta ? "1" : "0";
      el.style.width = el.style.height = M.tam + "px";
      el.innerHTML = ico(item.id);
      const x0 = item.carril * anchoCarril + (anchoCarril - M.tam) / 2;
      const a = {item, el, x0, y: M.top - M.tam, nace: relojLluvia, fase: Math.random() * 6.28, vivo: true};
      el.addEventListener("pointerdown", ev => { ev.preventDefault(); tocar(a); });
      $("#area").appendChild(el);
      activos.push(a);
    }
    function tocar(a){
      if(!a.vivo || enPausa) return;
      if(a.item.meta){
        a.vivo = false;
        ronda.atrapadas[a.item.id]++;
        sAtrapa();
        volarACesta(a.el);
        terminados++;
      } else if(!a.el.classList.contains("mal")){
        ronda.malas++;
        sNo();
        a.el.classList.add("mal");
      }
    }
    function paso(ahora){
      const dt = Math.min(.1, (ahora - previo) / 1000) * ESCALA();
      previo = ahora;
      if(!enPausa){
        relojLluvia += dt;
        while(siguiente < total && ronda.plan[siguiente].t <= relojLluvia){ crear(ronda.plan[siguiente]); siguiente++; }
        const recorrido = M.h - M.top + M.tam;
        for(const a of activos){
          if(!a.vivo) continue;
          const p = (relojLluvia - a.nace) / nivel.caida;
          a.y = M.top - M.tam + p * recorrido;
          const x = a.x0 + Math.sin(a.fase + p * 5) * 8;
          a.el.style.transform = `translate(${x}px,${a.y}px)`;
          if(p >= 1){ a.vivo = false; a.el.remove(); terminados++; }
        }
        activos = activos.filter(a => a.vivo);
      }
      if(terminados >= total && siguiente >= total){ rafId = null; setTimeout(res, 500 / ESCALA()); return; }
      rafId = requestAnimationFrame(paso);
    }
    rafId = requestAnimationFrame(paso);
  });
}
function volarACesta(el){
  const r = el.getBoundingClientRect(), c = $("#cesta").getBoundingClientRect(), app = $("#app").getBoundingClientRect();
  const v = el.cloneNode(true); v.className = "vuela";
  v.style.left = (r.left - app.left) + "px"; v.style.top = (r.top - app.top) + "px";
  v.style.width = r.width + "px"; v.style.height = r.height + "px";
  $("#s-juego").appendChild(v); el.remove();
  requestAnimationFrame(() => {
    const dx = (c.left + c.width/2) - (r.left + r.width/2), dy = (c.top + 20) - (r.top + r.height/2);
    v.style.transform = `translate(${dx}px,${dy}px) scale(.35)`; v.style.opacity = "0";
  });
  setTimeout(() => v.remove(), 600);
}
$("#pausa").onclick = () => { enPausa = true; $("#velo").style.display = "flex"; };
$("#b-seguir").onclick = () => { enPausa = false; $("#velo").style.display = "none"; };
$("#b-salir").onclick = () => { enPausa = true; if(rafId) cancelAnimationFrame(rafId); rafId = null; $("#velo").style.display = "none"; limpiarArea(); pantallaMapa(); };

/* ============ PREGUNTAS ============ */
let valorVisor = "";
function pintarTeclado(alListo){
  const t = $("#teclado"); t.innerHTML = "";
  ["1","2","3","4","5","6","7","8","9","borrar","0","listo"].forEach(k => {
    const b = document.createElement("button");
    b.className = "tecla" + (k === "listo" ? " ok" : k === "borrar" ? " borra" : "");
    b.dataset.k = k;
    b.textContent = k === "listo" ? "Listo" : k === "borrar" ? "Borrar" : k;
    b.onclick = () => {
      if(k === "borrar") valorVisor = valorVisor.slice(0, -1);
      else if(k === "listo"){ if(valorVisor !== "") alListo(parseInt(valorVisor, 10)); return; }
      else if(valorVisor.length < 2) valorVisor += k;
      $("#visor").textContent = valorVisor;
    };
    t.appendChild(b);
  });
}
function textoPregunta(id){
  const ini = ronda.inicio[id];
  return ini
    ? `Tu canasta empezó con ${ini} ${OBJ[id].p}. ¿${cuantas(id)} ${OBJ[id].p} hay ahora en tu canasta?`
    : `¿${cuantas(id)} ${OBJ[id].p} atrapaste?`;
}
function preguntar(id){
  return new Promise(res => {
    valorVisor = ""; $("#visor").textContent = "";
    $("#t-pregunta").style.display = ""; $("#t-ensena").style.display = "none";
    $("#preg-icono").innerHTML = ico(id);
    const txt = textoPregunta(id);
    $("#preg-texto").textContent = txt;
    const teclas = () => $("#teclado").querySelectorAll("button");
    pintarTeclado(v => res(v));
    teclas().forEach(b => b.disabled = true);
    hablar(txt).then(() => teclas().forEach(b => b.disabled = false));
  });
}
async function preguntas(){
  ir("s-pregunta");
  let primerasBien = 0;
  for(const id of ronda.metas){
    const correcta = ronda.inicio[id] + ronda.atrapadas[id];
    let v = await preguntar(id);
    const bienPrimera = v === correcta;
    ronda.respuestas.push({id, correcta, dada: v, primera: bienPrimera});
    if(bienPrimera){
      primerasBien++; sBien();
      const el = ronda.inicio[id] ? ELOGIO_SEGUIR : ELOGIOS[azar(0, ELOGIOS.length - 1)];
      await guia(`Sí, ${hay(id, correcta)}. ${el}`);
    } else {
      while(v !== correcta){
        await guia("Vamos a verlas juntas, una por una.");
        await ensenar(id);
        v = await preguntar(id);
      }
      await guia(`Eso es, ${hay(id, correcta)}. Contar de uno en uno te dio la respuesta.`);
    }
  }
  terminarNivel(primerasBien);
}

/* Re-enseñanza: modelo pictórico en filas de cinco; la voz cuenta desde el número de la canasta. */
async function ensenar(id){
  $("#t-pregunta").style.display = "none"; $("#t-ensena").style.display = "";
  const ini = ronda.inicio[id], n = ronda.atrapadas[id];
  const filas = $("#filas"); filas.innerHTML = ""; $("#dicho").textContent = "";
  let cajaIni = null;
  if(ini){
    cajaIni = document.createElement("div"); cajaIni.className = "caja-inicio";
    cajaIni.innerHTML = `${ico(id)} ${ini}`;
    filas.appendChild(cajaIni);
  }
  const items = [];
  for(let f = 0; f < Math.ceil(n / 5); f++){
    const fila = document.createElement("div"); fila.className = "fila";
    for(let k = 0; k < 5 && f*5 + k < n; k++){
      const it = document.createElement("div"); it.className = "it"; it.innerHTML = ico(id);
      fila.appendChild(it); items.push(it);
    }
    filas.appendChild(fila);
  }
  if(ini){
    cajaIni.classList.add("luz"); $("#dicho").textContent = ini;
    await hablar(`Empezamos en ${NUMS[ini]}.`);
  }
  if(n === 0){
    const t = ini ? `No atrapaste más. Se queda en ${NUMS[ini]}.` : `No atrapaste ninguna. Es cero.`;
    $("#dicho").textContent = ini || 0;
    await hablar(OBJ[id].g === "m" ? t.replace("ninguna", "ninguno") : t);
    return;
  }
  if(cajaIni) cajaIni.classList.remove("luz");
  for(let i = 0; i < n; i++){
    items.forEach((it, j) => it.classList.toggle("luz", j === i));
    const num = ini + i + 1;
    $("#dicho").textContent = num;
    await hablar(NUMS[num] + ".");
  }
  items.forEach(it => it.classList.add("luz"));
  $("#dicho").textContent = ini + n;
  const fin = hay(id, ini + n, true);
  await hablar(fin.charAt(0).toUpperCase() + fin.slice(1) + ".");
  await espera(400);
}

/* ============ RESULTADO ============ */
async function terminarNivel(bien){
  const total = ronda.metas.length;
  const superado = bien === total;
  const prev = estado.niveles[nivel.n] || {estrellas:0, superado:false};
  estado.niveles[nivel.n] = {estrellas: Math.max(prev.estrellas, bien), superado: prev.superado || superado};
  // Repetición espaciada: guarda lo que se contó mal; borra lo que ya salió bien
  const mal = ronda.respuestas.filter(r => !r.primera).map(r => r.id);
  const okIds = ronda.respuestas.filter(r => r.primera).map(r => r.id);
  const pend = (estado.repaso[nivel.n] || []).filter(id => !okIds.includes(id));
  mal.forEach(id => { if(!pend.includes(id)) pend.push(id); });
  if(pend.length) estado.repaso[nivel.n] = pend; else delete estado.repaso[nivel.n];
  guardar();

  ir("s-resultado");
  $("#res-titulo").textContent = superado ? nivel.nombre + ": ¡nivel superado!" : nivel.nombre + ": vamos otra vez";
  $("#res-estrellas").innerHTML = "★".repeat(bien) + `<span class="vacia">${"★".repeat(total - bien)}</span>`;
  const haySig = nivel.n < NIVELES.length;
  $("#b-siguiente").style.display = superado && haySig ? "" : "none";
  ["#b-siguiente","#b-repetir","#b-res-mapa"].forEach(s => $(s).disabled = true);
  if(superado){
    await guia(haySig ? "Contaste todo bien a la primera. Se abrió el siguiente nivel." : "Contaste todo bien a la primera. Terminaste los diez niveles. Recorriste todos los lugares contando con cuidado.");
  } else {
    await guia("Para abrir el siguiente nivel, todas las cuentas tienen que salir bien a la primera. Vamos a jugar este nivel otra vez, con una lluvia nueva. Truco: di el número en voz baja cada vez que atrapes algo.");
  }
  ["#b-siguiente","#b-repetir","#b-res-mapa"].forEach(s => $(s).disabled = false);
}
$("#b-siguiente").onclick = () => empezarNivel(nivel.n + 1);
$("#b-repetir").onclick = () => empezarNivel(nivel.n);
$("#b-res-mapa").onclick = pantallaMapa;
</script>
