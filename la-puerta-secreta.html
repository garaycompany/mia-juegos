<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La puerta secreta — la historieta de Coraline</title>
<style>
:root{
  --papel:#fff8ec; --tinta:#1f2a44; --rojo:#c8423b; --rosa:#e9658f; --rojo-suave:#fde3e6;
  --verde:#3f8f6b; --azul:#2f5fb3; --amarillo:#ffd93b; --amarillo-suave:#fff1a8; --gris:#8a93a8;
  --sombra:rgba(31,42,68,.18);
  /* Letra ancha y clara: b/d/p/q bien distintas. Es un juego de lectura. */
  --fuente:Verdana,"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;
  /* Letra GRANDE, crece con la pantalla: Echo Show 5 (480 de alto) = 26 px; Show 8/10 (800) = 43 px. */
  --letra:clamp(26px,5.4vmin,48px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--papel);color:var(--tinta);font-family:var(--fuente)}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.pantalla{position:absolute;inset:0;display:none;flex-direction:column}
.pantalla.visible{display:flex}

/* ---------- portada ---------- */
#portada{flex-direction:row;align-items:center;justify-content:center;padding:2vmin 3vmin;gap:3vmin;
  background:radial-gradient(circle at 70% 40%,#fff3c4,var(--papel) 60%)}
#portada .figuras{display:flex;align-items:flex-end;height:78vh;max-width:46vw}
#portada .figuras img{height:100%;width:auto;object-fit:contain;margin-left:-3vmin;filter:drop-shadow(0 6px 0 var(--sombra))}
#portada .figuras img:first-child{margin-left:0}
#portada .lado{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2vmin;max-width:52vw}
#portada h1{font-size:clamp(32px,9vmin,84px);margin:0;color:var(--azul);line-height:1.05}
#portada .sub{font-size:clamp(18px,4.2vmin,38px);margin:0}
#portada .autora{font-size:clamp(13px,2.6vmin,22px);color:var(--gris);margin:0}
.grande{font-size:clamp(22px,5vmin,44px);font-weight:bold;border:0;border-radius:22px;
  padding:2vmin 5vmin;min-height:64px;box-shadow:0 5px 0 var(--sombra);color:#fff;background:var(--verde)}
.grande:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sombra)}
.discreto{background:none;border:2px solid var(--gris);color:var(--gris);border-radius:14px;
  font-size:clamp(14px,2.6vmin,22px);padding:8px 14px;min-height:44px}
.fila{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;align-items:center}
#estadoVoz{font-size:clamp(13px,2.4vmin,20px);color:var(--gris);margin:0}
.version{font-size:12px;color:var(--gris);letter-spacing:1px}

/* ---------- video de entrada (animación hecha con código) ---------- */
#intro{background:#171a33;align-items:center;justify-content:center}
#intro svg{width:100%;height:100%}
#saltarIntro{position:absolute;right:2vmin;bottom:2vmin;z-index:3;background:rgba(255,255,255,.12);color:#fff;border-color:#fff}
#intro .titulo{position:absolute;top:8%;width:100%;text-align:center;color:#ffe9a8;font-size:clamp(30px,9vmin,84px);
  font-weight:bold;opacity:0;animation:aparecer 1.2s 3.6s forwards;text-shadow:0 4px 0 rgba(0,0,0,.4)}
@keyframes aparecer{to{opacity:1}}

/* ---------- viñeta ---------- */
#vineta{padding:1.4vmin 2vmin;gap:1.4vmin}
#barra{display:flex;align-items:center;gap:12px;font-size:clamp(14px,2.8vmin,24px);color:var(--gris);min-height:44px}
#barra .puntos{display:flex;gap:6px;flex:1}
#barra .punto{width:14px;height:14px;border-radius:50%;background:#e8dcc4}
#barra .punto.hecho{background:var(--azul)}
#cuerpo{flex:1;display:flex;gap:2vmin;min-height:0}
#dibujo{flex:1 1 48%;border:5px solid var(--tinta);border-radius:18px;background:#fff;overflow:hidden;position:relative}
#dibujo > svg.fondo{position:absolute;inset:0;width:100%;height:100%}
#dibujo .pj{position:absolute;bottom:0;height:78%;width:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
#texto{flex:1 1 52%;display:flex;flex-direction:column;border:5px solid var(--tinta);border-radius:18px;
  background:#fff;padding:2vmin 2.6vmin;overflow:auto}
#quien{font-size:clamp(16px,3.2vmin,28px);font-weight:bold;color:var(--azul);margin-bottom:1vmin;min-height:1em}
#frase{font-size:var(--letra);line-height:1.5;word-spacing:.12em;letter-spacing:.01em}
.pal{border-radius:8px;padding:0 .06em;cursor:pointer}
.pal:active,.pal.sonando{background:var(--amarillo-suave)}
.pal.pista{background:var(--rojo-suave);box-shadow:0 0 0 3px var(--rojo);border-radius:6px}
#ayudaToque{margin-top:auto;padding-top:1vmin;font-size:clamp(13px,2.4vmin,20px);color:var(--gris)}
#pie{display:flex;align-items:center;gap:2vmin}
.flecha{width:clamp(64px,14vmin,120px);min-height:clamp(56px,11vmin,96px);border:0;border-radius:18px;
  font-size:clamp(26px,6vmin,52px);color:#fff;background:var(--azul);box-shadow:0 5px 0 var(--sombra)}
.flecha:disabled{background:#cfd6e2;box-shadow:none}
#escuchar{flex:1;min-height:clamp(56px,11vmin,96px);border:4px solid var(--azul);background:#fff;color:var(--azul);
  border-radius:18px;font-size:clamp(17px,3.6vmin,32px);font-weight:bold}
#escuchar:disabled{border-color:#cfd6e2;color:var(--gris)}

/* ---------- animaciones de las viñetas ("videos" hechos con código) ---------- */
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes brillo{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes correr{from{left:-70%}to{left:105%}}
@keyframes rebote{0%,100%{transform:translateY(0)}40%{transform:translateY(-14%)}}
@keyframes fuego{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.18) translateY(-2px)}}
@keyframes cola{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
@keyframes abrir{from{transform:perspective(600px) rotateY(0)}to{transform:perspective(600px) rotateY(-75deg)}}
@keyframes rayos{from{opacity:0}to{opacity:1}}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes entrar{from{transform:translateY(12%);opacity:0}to{transform:none;opacity:1}}
.flota{animation:flotar 2.6s ease-in-out infinite}
.brilla{animation:brillo 1.6s ease-in-out infinite}
.pj.corre{animation:correr 3.2s linear infinite;left:-70%}
.pj.salta{animation:rebote .9s ease-in-out infinite}
.pj.entra{animation:entrar .7s ease-out both}
.llama{transform-origin:50% 100%;transform-box:fill-box;animation:fuego .5s ease-in-out infinite}
.cola{transform-origin:0% 50%;transform-box:fill-box;animation:cola 1.8s ease-in-out infinite}
.hoja-puerta{transform-origin:0% 50%;transform-box:fill-box;animation:abrir 3s 0.6s ease-in-out forwards}
.rayos{opacity:0;animation:rayos 2s 1.6s forwards}
.gira{transform-origin:50% 50%;transform-box:fill-box;animation:girar 6s linear infinite}

/* ---------- burbuja de sílabas ---------- */
#silabas{position:absolute;left:50%;top:10%;transform:translateX(-50%);z-index:30;display:none;
  background:var(--amarillo-suave);border:5px solid var(--tinta);border-radius:22px;padding:1.5vmin 4vmin;
  font-size:clamp(34px,9vmin,84px);font-weight:bold;letter-spacing:.06em;box-shadow:0 6px 0 var(--sombra);white-space:nowrap}
#silabas.visible{display:block}
#silabas .sep{color:var(--rojo);padding:0 .12em}

/* ---------- pregunta ---------- */
#pregunta{padding:2.2vmin 3vmin;gap:1.8vmin;align-items:center;justify-content:center}
#pregunta .tipo{font-size:clamp(15px,3vmin,26px);color:var(--rosa);font-weight:bold;letter-spacing:1px}
#pregunta h2{font-size:var(--letra);margin:0;text-align:center;line-height:1.3;max-width:1100px}
#opciones{display:flex;flex-direction:column;gap:1.4vmin;width:100%;max-width:1100px}
.opcion{border:5px solid var(--azul);background:#fff;border-radius:18px;text-align:left;
  font-size:clamp(20px,4.4vmin,40px);padding:1.2vmin 2.4vmin;min-height:clamp(54px,10.5vmin,96px);color:var(--tinta);line-height:1.3}
.opcion:disabled{opacity:.55}
.opcion.bien{border-color:var(--verde);background:#e3f4ea;opacity:1}

/* ---------- mensajes ---------- */
#mensaje{flex-direction:row;align-items:center;justify-content:center;padding:3vmin;gap:3vmin}
#mensaje img{height:62vh;width:auto;max-width:34vw;object-fit:contain}
#mensaje .lado{display:flex;flex-direction:column;align-items:center;gap:3vmin;max-width:900px}
#mensaje p{font-size:var(--letra);margin:0;line-height:1.45;text-align:center}
#mensaje .cita{font-style:italic;color:var(--rojo)}

/* ---------- final en papel ---------- */
#final{align-items:center;justify-content:center;text-align:center;padding:3vmin;gap:2.2vmin}
#final .hoja{border:5px dashed var(--tinta);border-radius:18px;padding:2.2vmin 4vmin;background:#fff;max-width:1100px}
#final p{font-size:var(--letra);margin:0;line-height:1.45}
#final .lapices{font-size:clamp(34px,9vmin,80px)}

/* ---------- taller de emociones ---------- */
#emocion{flex-direction:row;align-items:center;gap:3vmin;padding:2.4vmin 3vmin}
#emocion .cara{flex:0 0 40%;height:100%;display:flex;align-items:center;justify-content:center;
  background:#fff;border:5px solid var(--tinta);border-radius:18px;overflow:hidden}
#emocion .cara img{max-height:96%;max-width:96%;object-fit:contain}
#emocion .lado{flex:1;display:flex;flex-direction:column;gap:2.4vmin}
#emocion .paso{font-size:clamp(15px,3vmin,26px);color:var(--rosa);font-weight:bold;letter-spacing:1px}
#emocion .txt{font-size:var(--letra);line-height:1.45}
#emocion .txt b{color:var(--azul)}
#emocion .fila{justify-content:flex-start}
.grande.claro{background:#fff;color:var(--verde);border:4px solid var(--verde)}
.silabasEmo{position:absolute;left:50%;top:6%;transform:translateX(-50%);z-index:30;display:none;
  background:var(--amarillo-suave);border:5px solid var(--tinta);border-radius:22px;padding:1.5vmin 4vmin;
  font-size:clamp(34px,9vmin,84px);font-weight:bold;white-space:nowrap}
.silabasEmo.visible{display:block}
@media (orientation:portrait){ #emocion{flex-direction:column} #emocion .cara{flex:0 0 38%;width:100%} }

/* ---------- para papá ---------- */
#papa{padding:3vmin;gap:1.6vmin;overflow:auto;font-size:clamp(15px,2.8vmin,24px)}
#papa h2{margin:0}
#papa table{border-collapse:collapse;width:100%;max-width:1000px}
#papa td,#papa th{border-bottom:1px solid #e8dcc4;padding:6px 8px;text-align:left}

@media (orientation:portrait){
  #cuerpo{flex-direction:column}
  #dibujo{flex:1 1 42%}
  #texto{flex:1 1 58%}
  #portada{flex-direction:column}
  #portada .figuras{height:38vh;max-width:90vw}
  #portada .lado{max-width:92vw}
  #mensaje{flex-direction:column}
  #mensaje img{height:30vh;max-width:70vw}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<!-- PORTADA -->
<section id="portada" class="pantalla visible">
  <div class="figuras" id="figurasPortada"></div>
  <div class="lado">
    <h1>La puerta secreta</h1>
    <p class="sub" id="subtitulo"></p>
    <div class="fila">
      <button class="grande" id="empezar">Empezar a leer</button>
      <button class="grande" id="seguir" style="display:none;background:var(--azul)">Seguir donde iba</button>
    </div>
    <p class="autora">Coraline, el personaje de Mia</p>
    <p id="estadoVoz"></p>
    <div class="fila"><button class="discreto" id="verIntro">Ver el video</button>
      <button class="discreto" id="verPapa">Para papá</button></div>
    <span class="version" id="ver"></span>
  </div>
</section>

<!-- VIDEO DE ENTRADA -->
<section id="intro" class="pantalla">
  <div class="titulo">La puerta secreta</div>
  <div id="escenaIntro" style="position:absolute;inset:0"></div>
  <button class="discreto" id="saltarIntro">Saltar ▶</button>
</section>

<!-- VIÑETA -->
<section id="vineta" class="pantalla">
  <div id="barra"><span id="numVineta"></span><div class="puntos" id="puntos"></div>
    <button class="discreto" id="salir">Salir</button></div>
  <div id="cuerpo">
    <div id="dibujo"></div>
    <div id="texto">
      <div id="quien"></div>
      <div id="frase"></div>
      <div id="ayudaToque">Toca una palabra difícil para escucharla.</div>
    </div>
  </div>
  <div id="pie">
    <button class="flecha" id="atras" aria-label="Viñeta anterior">◀</button>
    <button id="escuchar">🔊 Primero léela tú</button>
    <button class="flecha" id="adelante" aria-label="Viñeta siguiente">▶</button>
  </div>
  <div id="silabas"></div>
</section>

<!-- PREGUNTA -->
<section id="pregunta" class="pantalla">
  <div class="tipo" id="tipoPregunta"></div>
  <h2 id="textoPregunta"></h2>
  <div id="opciones"></div>
</section>

<!-- MENSAJE -->
<section id="mensaje" class="pantalla">
  <img id="caraMensaje" alt="">
  <div class="lado"><p id="textoMensaje"></p><button class="grande" id="botonMensaje">Seguir</button></div>
</section>

<!-- FINAL EN PAPEL -->
<section id="final" class="pantalla">
  <div class="lapices">✏️🖍️📄</div>
  <div class="hoja"><p id="textoFinal"></p></div>
  <button class="grande" id="yaDibuje">¡Ya lo dibujé!</button>
</section>

<!-- TALLER DE EMOCIONES: dibujar a Coraline en papel, una cara a la vez -->
<section id="emocion" class="pantalla">
  <div class="cara"><img id="caraEmocion" alt=""></div>
  <div class="lado">
    <div class="paso" id="pasoEmocion"></div>
    <div class="txt" id="textoEmocion"></div>
    <div class="fila" id="botonesEmocion"></div>
  </div>
  <div id="silabasEmo" class="silabasEmo"></div>
</section>

<!-- PARA PAPÁ -->
<section id="papa" class="pantalla">
  <h2>Para papá: cómo va Mia</h2>
  <div id="resumenPapa"></div>
  <div class="fila" style="justify-content:flex-start"><button class="discreto" id="volverPapa">Volver</button>
       <button class="discreto" id="borrarPapa">Empezar de cero</button></div>
</section>

<!-- Audios grabados (MP3) de cada viñeta y cada palabra: el Echo no trae voz del navegador. -->
<script src="la-puerta-secreta/audio/manifiesto.js"></script>
<script>
"use strict";
/* =====================================================================
   LA PUERTA SECRETA — historieta de lectura con Coraline, el personaje de Mia
   Tema 8: comprensión lectora (inferencia, predicción, causa y efecto).
   Diseño (ver historieta-lectura-propuesta.md y plan-mia-2026-11.md):
   · La comprensión es una PUERTA: las preguntas se responden con el TEXTO.
     Si se equivoca, vuelve a la viñeta con la frase marcada y la relee.
   · La voz de la viñeta se desbloquea DESPUÉS de un tiempo de lectura.
   · Tocar una palabra: la dice despacio y la muestra en sílabas
     (si el aparato no tiene voz, las sílabas se ven igual).
   · Coraline se equivoca (busca en la cama) y vence releyendo la pista.
   · Final abierto en papel y con colores: ¿qué hay detrás de la puerta?
   · Todo queda guardado en el aparato y se ve en "Para papá".
   ===================================================================== */
const VERSION = '1.5';
const EPISODIO = 1;
const CLAVE = 'mia_puerta_secreta_ep' + EPISODIO;
const IMG = 'la-puerta-secreta/';                 // carpeta de dibujos junto a este archivo

/* ---------- PERSONAJES ---------- */
const P = { cora:'Coraline', abuela:'Helena', gato:'Pelusa', nota:'La nota' };
const CARA = n => IMG + 'coraline/' + n + '.webp';

/* ---------- EL EPISODIO ---------- */
const VINETAS = [
  { quien:'', escena:'taller', cara:'feliz',
    texto:'Es sábado. {cora} visita el taller de la abuela {abuela}. Allí hay lanas, botones de colores y un gato gris que se llama {gato}.' },
  { quien:'cora', escena:'estante', cara:'sorprendida',
    texto:'¡Abuela, mira! Detrás del estante hay una puerta pequeñita. ¡Es tan chiquita como un libro!' },
  { quien:'', escena:'cerradura', cara:'pensativa',
    texto:'La puerta tiene una cerradura con forma de flor. Está cerrada con llave. Al lado hay una nota.' },
  { quien:'nota', escena:'nota', cara:'',
    texto:'La nota dice: «La llave duerme donde duerme {gato} cuando hace frío».' },
  { quien:'cora', escena:'pasillo', cara:'corriendo', anim:'corre',
    texto:'¡Ya sé! {gato} duerme en mi cama. ¡Voy a buscar la llave ahí!' },
  { quien:'', escena:'cuarto', cara:'cansada',
    texto:'{cora} busca debajo de la almohada y entre las sábanas. No hay ninguna llave. Se siente cansada.' },
  { quien:'abuela', escena:'abuela', cara:'triste',
    texto:'En verano, {gato} duerme en tu cama. Pero cuando hace frío, busca el lugar más calientito de la casa.' },
  { quien:'cora', escena:'idea', cara:'primer-plano',
    texto:'Voy a leer la nota otra vez... ¡Cuando hace frío! El lugar más calientito es junto a la estufa.' },
  { quien:'', escena:'estufa', cara:'saltando', anim:'salta',
    texto:'Junto a la estufa está la canasta de lanas. {gato} duerme encima. Debajo de la lana brilla una llave con forma de flor.' },
  { quien:'', escena:'abrir', cara:'riendo',
    texto:'{cora} pone la llave en la cerradura. Gira una vez, gira dos veces... ¡La puerta secreta se abre despacio!' }
];

/* ---------- PREDICCIÓN (antes de la viñeta 6) ---------- */
const PREDICCION = {
  antesDe: 6,
  texto:'{cora} corre a buscar la llave en su cama. ¿Qué crees que va a pasar?',
  opciones:['Encuentra la llave debajo de la almohada.', 'No encuentra ninguna llave en la cama.', '{gato} le trae la llave en la boca.'],
  ok:1,
  bien:'¡Lo predijiste! El cuento dice: «No hay ninguna llave».',
  mal:'Mira lo que pasó de verdad. El cuento dice: «No hay ninguna llave». Predecir y después comprobar es lo que hace una detective.'
};

/* ---------- PREGUNTAS: la respuesta está en el TEXTO ---------- */
const PREGUNTAS = [
  { tipo:'LA PISTA ESCONDIDA', texto:'¿Por qué la llave no estaba en la cama?',
    opciones:['Porque {gato} la llevó al jardín.', 'Porque la nota decía: donde duerme {gato} cuando hace frío.', 'Porque la abuela la tenía en el bolsillo.'],
    ok:1, vineta:4, pista:'cuando hace frío',
    bien:'Leíste la nota con cuidado. Las palabras «cuando hace frío» eran la pista.' },
  { tipo:'¿CÓMO SE SENTÍA?', texto:'{cora} no encontró la llave en la cama. ¿Cómo se sentía?',
    opciones:['Muy contenta.', 'Enojada con la abuela.', 'Cansada y un poco triste.'],
    ok:2, vineta:6, pista:'Se siente cansada',
    bien:'El cuento dice «Se siente cansada». Buscaste las palabras exactas.' },
  { tipo:'¿POR QUÉ?', texto:'¿Por qué {gato} duerme junto a la estufa cuando hace frío?',
    opciones:['Porque es el lugar más calientito de la casa.', 'Porque ahí está su comida.', 'Porque la abuela lo manda ahí.'],
    ok:0, vineta:7, pista:'busca el lugar más calientito de la casa',
    bien:'Uniste dos pistas: hace frío, y la estufa es lo más calientito.' }
];

const FINAL = '¿Qué hay detrás de la puerta secreta? Toma una hoja y tus colores. Dibuja lo que encuentra {cora}. Dibuja un globo y escribe lo que dice.';

/* ---------- SÍLABAS de las palabras largas o difíciles ---------- */
const SILABAS = {
  'sábado':'sá-ba-do','coraline':'Co-ra-li-ne','visita':'vi-si-ta','taller':'ta-ller','abuela':'a-bue-la',
  'helena':'He-le-na','allí':'a-llí','lanas':'la-nas','botones':'bo-to-nes','colores':'co-lo-res','gato':'ga-to',

  'puerta':'puer-ta','pequeñita':'pe-que-ñi-ta','chiquita':'chi-qui-ta','como':'co-mo','libro':'li-bro',
  'tiene':'tie-ne','cerradura':'ce-rra-du-ra','forma':'for-ma','flor':'flor','está':'es-tá','cerrada':'ce-rra-da',
  'llave':'lla-ve','lado':'la-do','nota':'no-ta','dice':'di-ce','duerme':'duer-me','donde':'don-de',
  'cuando':'cuan-do','hace':'ha-ce','frío':'frí-o','cama':'ca-ma','buscar':'bus-car','busca':'bus-ca',
  'debajo':'de-ba-jo','almohada':'al-mo-ha-da','entre':'en-tre','sábanas':'sá-ba-nas','ninguna':'nin-gu-na',
  'sienta':'sien-ta','cansada':'can-sa-da','verano':'ve-ra-no','pero':'pe-ro','lugar':'lu-gar','más':'más',

/* =================== VOZ ===================
   v1.5: el navegador del Echo Show no suena con la voz del navegador (speechSynthesis), aunque
   diga que la tiene. Por eso cada viñeta y cada palabra van GRABADAS en MP3 (voz es-PE),
   que el Echo reproduce como cualquier audio. Un solo reproductor para todo: se "desbloquea"
   con el primer toque y después suena siempre. La voz del navegador queda solo de respaldo
   si falta un archivo. */
const AUDIO = window.AUDIO_MIA || { vinetas:{}, palabras:{} };
const Voz = (function(){
  let voz = null;
  const reproductor = new Audio(); reproductor.preload = 'auto';
  window.__reproductorMia = reproductor;   /* para revisar desde afuera si suena */
  const hay = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  function elegir(){
    if(!hay) return;
    const vs = window.speechSynthesis.getVoices() || [];
    voz = vs.find(v=>/^es[-_](US|MX|419|PE)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
    setTimeout(pintarEstado, 0);
  }
  if(hay){ elegir(); window.speechSynthesis.onvoiceschanged = elegir; }
  function sonar(archivo){
    return new Promise((res, rej)=>{
      let listo=false; const fin=(ok)=>{ if(!listo){ listo=true; reproductor.onended=reproductor.onerror=null; ok?res():rej(); } };
      try{
        reproductor.pause();
        reproductor.src = IMG + archivo;
        reproductor.onended = ()=>fin(true);
        reproductor.onerror = ()=>fin(false);
        const p = reproductor.play();
        if(p && p.catch) p.catch(()=>fin(false));
        setTimeout(()=>fin(true), 20000);   /* red de seguridad */
      }catch(e){ fin(false); }
    });
  }
  function grabadoODicho(archivo, texto, lento){
    if(archivo) return sonar(archivo).catch(()=>decir(texto, lento));
    return decir(texto, lento);
  }
  function decir(texto, lento){
    return new Promise(res=>{
      if(!hay){ res(); return; }
      let listo=false; const fin=()=>{ if(!listo){ listo=true; res(); } };
      try{
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(texto);
        u.lang = voz ? voz.lang : 'es-US';
        if(voz) u.voice = voz;
        u.rate = lento ? 0.7 : 0.88; u.pitch = 1.05;
        u.onend = fin; u.onerror = fin;
        setTimeout(fin, 1500 + texto.length * 110);   /* red de seguridad si el aparato no avisa */
        window.speechSynthesis.speak(u);
      }catch(e){ fin(); }
    });
  }
  return {
    grabado: ()=>Object.keys(AUDIO.palabras||{}).length>0,
    conVoz: ()=>Object.keys(AUDIO.palabras||{}).length>0 || (hay && voz!==null),
    /* la palabra: primero despacio por sílabas y luego entera, en un solo audio */
    palabra: (limpia, silabas)=>grabadoODicho((AUDIO.palabras||{})[limpia], silabas.split('-').length>1 ? silabas.split('-').join(', ')+'. '+limpia : limpia, true),
    vineta: (n, texto)=>grabadoODicho((AUDIO.vinetas||{})[n], texto, false),
    decir
  };
})();
function pintarEstado(){
  $('#estadoVoz').textContent = Voz.grabado() ? '🔊 Audio listo' : '🔊 Sin audio grabado: se usará la voz del aparato.';
}
/* Para el generador de audio: todo lo que Mia puede escuchar */
function textosParaAudio(){
  const vin = VINETAS.map(v=>nombres(v.texto));
  const emo = [];
  EMOCIONES.forEach(e=>{
    emo.push('Mira bien la cara de ' + P.cora + '. Dibújala en una hoja, con tus colores.');
    emo.push('Muéstrale tu dibujo a papá y mamá. Diles: ¿cómo se siente ' + P.cora + '?');
    emo.push(P.cora + ' está ' + e.nombre + '. ' + e.pistas + ' ¿Cuándo te sentiste así? Cuéntaselo a papá y mamá.');
  });
  const pals = {};
  vin.concat(emo).forEach(t=>palabras(t).forEach(w=>{ const l=normal(w); if(l) pals[l] = SILABAS[l] || l; }));
  return { vinetas: vin, palabras: pals };
}

  const v = VINETAS[i];

  const frase = $('#frase'); frase.innerHTML='';
  palabras(v.texto).forEach(w=>{
    const s=document.createElement('span'); s.className='pal'; s.textContent=w;
    s.addEventListener('click', ()=>tocarPalabra(s, w));
    frase.appendChild(s); frase.appendChild(document.createTextNode(' '));
  });
  if(pistaMarcada) marcarPista(pistaMarcada);
  pintarEscena(v);
  const n = palabras(v.texto).length;
  const tSig = Math.max(3, Math.round(n*0.35)) * 1000;
  const tVoz = Math.max(6, Math.round(n*0.6)) * 1000;
  $('#atras').disabled = (i===0) || volverAPregunta!==null;
  $('#adelante').disabled = true;
  $('#escuchar').disabled = true; $('#escuchar').textContent='🔊 Primero léela tú';
  clearTimeout(reloj); clearTimeout(relojVoz);
  reloj = setTimeout(()=>{ $('#adelante').disabled=false; }, volverAPregunta!==null ? Math.max(4000,tSig) : tSig);
  relojVoz = setTimeout(()=>{ $('#escuchar').disabled=false; $('#escuchar').textContent='🔊 Escuchar la viñeta'; }, tVoz);
  E.vineta = i; guardar();
}
function marcarPista(pista){
  const objetivo = palabras(pista).map(normal);
  const spans = [...document.querySelectorAll('#frase .pal')];
  for(let a=0;a<=spans.length-objetivo.length;a++){
    if(objetivo.every((w,k)=>normal(spans[a+k].textContent)===w)){
      for(let k=0;k<objetivo.length;k++) spans[a+k].classList.add('pista');
      return;
    }
  }
}
function tocarPalabra(span, w, burbuja){
  const limpia = normal(w); if(!limpia) return;
  E.toques[limpia] = (E.toques[limpia]||0) + 1; guardar();
  const sil = SILABAS[limpia] || limpia;
  const b=$(burbuja || '#silabas');
  b.innerHTML = sil.split('-').map(x=>'<span>'+x+'</span>').join('<span class="sep">·</span>');
  b.classList.add('visible'); span.classList.add('sonando');
  Voz.palabra(limpia, sil).then(()=>{
    setTimeout(()=>{ b.classList.remove('visible'); span.classList.remove('sonando'); }, Voz.conVoz()?300:1800);
  });
}
$('#escuchar').addEventListener('click', ()=>{
  const spans=[...document.querySelectorAll('#frase .pal')];
  spans.forEach(s=>s.classList.add('sonando'));
  Voz.vineta(i+1, nombres(VINETAS[i].texto)).then(()=>spans.forEach(s=>s.classList.remove('sonando')));
});
$('#atras').addEventListener('click', ()=>{ if(i>0){ i--; pistaMarcada=null; pintarVineta(); } });
$('#adelante').addEventListener('click', avanzar);
$('#salir').addEventListener('click', irPortada);

function avanzar(){
  if(volverAPregunta!==null){ const q=volverAPregunta; volverAPregunta=null; pistaMarcada=null; hacerPregunta(q, true); return; }
  if(i+1 === PREDICCION.antesDe && E.prediccion && E.prediccion.comprobada!==true){
    E.prediccion.comprobada = true; guardar();
    const ok = E.prediccion.eleccion === PREDICCION.ok;
    mensaje(nombres(ok ? PREDICCION.bien : PREDICCION.mal), ok ? 'feliz' : 'pensativa', ()=>{ i++; siguiente(); });
    return;
  }
  i++; siguiente();
}
function siguiente(){
  if(i === PREDICCION.antesDe - 1 && !E.prediccion){ i = PREDICCION.antesDe - 2; predecir(); return; }
  if(i >= VINETAS.length){ i = VINETAS.length-1; empezarPreguntas(); return; }
  pintarVineta(); mostrar('vineta');
}

/* =================== PREDICCIÓN =================== */
function predecir(){
  $('#tipoPregunta').textContent = '¿QUÉ PASARÁ?';
  $('#textoPregunta').textContent = nombres(PREDICCION.texto);
  const box=$('#opciones'); box.innerHTML='';
  PREDICCION.opciones.forEach((o,k)=>{
    const b=document.createElement('button'); b.className='opcion'; b.textContent=nombres(o);
    b.addEventListener('click', ()=>{
      E.prediccion = { eleccion:k, comprobada:false }; guardar();
      i = PREDICCION.antesDe - 1; pintarVineta(); mostrar('vineta');
    });
    box.appendChild(b);
  });
  mostrar('pregunta');
}

/* =================== PREGUNTAS (la puerta) =================== */
function empezarPreguntas(){
  const pend = PREGUNTAS.findIndex((q,k)=>!E.respuestas[k] || !E.respuestas[k].resuelta);
  if(pend<0){ irFinal(); return; }
  hacerPregunta(pend, false);
}
function hacerPregunta(k, esReintento){
  const q=PREGUNTAS[k];
  $('#tipoPregunta').textContent = q.tipo + (esReintento ? ' · OTRA VEZ' : '');
  $('#textoPregunta').textContent = nombres(q.texto);
  const box=$('#opciones'); box.innerHTML='';
  q.opciones.forEach((o,n)=>{
    const b=document.createElement('button'); b.className='opcion'; b.textContent=nombres(o);
    b.addEventListener('click', ()=>{
      box.querySelectorAll('button').forEach(x=>x.disabled=true);
      const r = E.respuestas[k] || { primerIntento:null, intentos:0, resuelta:false };
      r.intentos++;
      if(r.primerIntento===null) r.primerIntento = (n===q.ok);
      E.respuestas[k]=r;
      if(n===q.ok){
        r.resuelta=true; guardar(); b.classList.add('bien');
        setTimeout(()=>mensaje(nombres(q.bien), 'riendo', empezarPreguntas), 500);
      }else{
        guardar();
        mensaje('Vamos a buscar la pista en el cuento. Lee otra vez la parte marcada.', 'pensativa', ()=>{
          i = q.vineta-1; pistaMarcada = q.pista; volverAPregunta = k;
          pintarVineta(); mostrar('vineta');
        });
      }
    });
    box.appendChild(b);
  });
  mostrar('pregunta');
}

/* =================== MENSAJES, FINAL, PORTADA =================== */
function mensaje(texto, cara, despues){
  $('#textoMensaje').innerHTML = texto.replace(/«([^»]+)»/g,'<span class="cita">«$1»</span>');
  const im=$('#caraMensaje'); im.src = CARA(cara || 'feliz');
  $('#botonMensaje').onclick = despues;
  mostrar('mensaje');
}
function irFinal(){ $('#textoFinal').textContent = nombres(FINAL); mostrar('final'); }
$('#yaDibuje').addEventListener('click', ()=>{ E.dibujoPuerta = hoy(); guardar(); emocion(0, 'dibujar'); });

/* =================== TALLER DE EMOCIONES ===================
   Mia dibuja en papel cinco caras de Coraline, una por una. Cada dibujo se lo
   muestra a papá y mamá y les dice qué siente Coraline. Después la pantalla
   nombra la emoción y las pistas de la cara, y papá o mamá marcan cómo le fue. */
const EMOCIONES = [
  { id:'feliz',       nombre:'feliz',       pistas:'Mira: sonríe con toda la boca y abre los brazos.' },
  { id:'triste',      nombre:'triste',      pistas:'Mira: baja la cabeza y mira al piso.' },
  { id:'sorprendida', nombre:'sorprendida', pistas:'Mira: abre mucho los ojos y la boca, y se toca las mejillas.' },
  { id:'asustada',    nombre:'asustada',    pistas:'Mira: aprieta los dientes, suda y tiembla.' },
  { id:'enfadada',    nombre:'enojada',     pistas:'Mira: junta las cejas, cruza los brazos y le sale humo.' }
];
function textoTocable(caja, html){
  caja.innerHTML = '';
  html.split(/(<b>[^<]*<\/b>)/).forEach(trozo=>{
    const negrita = /^<b>/.test(trozo);
    const limpio = trozo.replace(/<\/?b>/g,'');
    const destino = negrita ? caja.appendChild(document.createElement('b')) : caja;
    limpio.split(/\s+/).filter(Boolean).forEach(w=>{
      const s=document.createElement('span'); s.className='pal'; s.textContent=w;
      s.addEventListener('click', ()=>tocarPalabra(s, w, '#silabasEmo'));
      destino.appendChild(s); destino.appendChild(document.createTextNode(' '));
    });
  });
}
function boton(texto, clase, accion){
  const b=document.createElement('button'); b.className='grande'+(clase?' '+clase:''); b.textContent=texto; b.onclick=accion; return b;
}
function emocion(k, paso){
  if(k >= EMOCIONES.length){ terminarTodo(); return; }
  const e = EMOCIONES[k];
  $('#caraEmocion').src = CARA(e.id);
  $('#pasoEmocion').textContent = 'LAS CARAS DE ' + P.cora.toUpperCase() + ' · ' + (k+1) + ' DE ' + EMOCIONES.length;
  const bot = $('#botonesEmocion'); bot.innerHTML = '';
  if(paso === 'dibujar'){
    textoTocable($('#textoEmocion'), 'Mira bien la cara de ' + P.cora + '. Dibújala en una hoja, con tus colores.');
    bot.appendChild(boton('¡Ya la dibujé!', '', ()=>emocion(k, 'mostrar')));
  }else if(paso === 'mostrar'){
    textoTocable($('#textoEmocion'), 'Muéstrale tu dibujo a papá y mamá. Diles: ¿cómo se siente ' + P.cora + '?');
    bot.appendChild(boton('Ya les dije', '', ()=>emocion(k, 'respuesta')));
  }else{
    textoTocable($('#textoEmocion'), P.cora + ' está <b>' + e.nombre + '.</b> ' + e.pistas + ' ¿Cuándo te sentiste así? Cuéntaselo a papá y mamá.');
    const marcar = bien => { E.emociones = E.emociones || {}; E.emociones[e.id] = { dijoBien:bien, cuando:hoy() }; guardar(); emocion(k+1, 'dibujar'); };
    bot.appendChild(boton('✔ Lo dijo bien', '', ()=>marcar(true)));
    bot.appendChild(boton('La aprendimos juntos', 'claro', ()=>marcar(false)));
  }
  mostrar('emocion');
}
function terminarTodo(){
  E.terminado = hoy(); guardar();
  const aciertos = PREGUNTAS.filter((q,k)=>E.respuestas[k] && E.respuestas[k].primerIntento).length;
  mensaje('¡Abriste la puerta secreta y dibujaste ' + EMOCIONES.length + ' caras de ' + P.cora + '! Encontraste ' + aciertos + ' de ' + PREGUNTAS.length +
    ' pistas al primer intento. Pídele a papá una foto de tus dibujos.', 'saludando', irPortada);
}
function irPortada(){
  $('#subtitulo').textContent = 'Episodio ' + EPISODIO + ': La llave que duerme';
  $('#seguir').style.display = (E.inicio && !E.terminado) ? '' : 'none';
  $('#empezar').textContent = E.terminado ? 'Leer otra vez' : 'Empezar a leer';
  pintarEstado(); mostrar('portada');
}
$('#figurasPortada').innerHTML = [1,2,3].map(n=>'<img alt="Coraline dibujada por Mia" src="'+IMG+'dibujos-de-mia/coraline-mia-'+n+'.webp">').join('');
function arrancar(){
  const toques=E.toques||{}; const sesiones=(E.sesiones||0)+1;
  E = nuevo(); E.toques=toques; E.sesiones=sesiones; E.inicio=hoy(); E.vioIntro=true;
  guardar(); i=0; pistaMarcada=null; volverAPregunta=null; pintarVineta(); mostrar('vineta');
}
$('#empezar').addEventListener('click', ()=>{ if(!E.vioIntro){ verIntro(arrancar); } else arrancar(); });
$('#seguir').addEventListener('click', ()=>{ i=E.vineta||0; pintarVineta(); mostrar('vineta'); });
$('#verIntro').addEventListener('click', ()=>verIntro(irPortada));

/* ---------- Para papá ---------- */
$('#verPapa').addEventListener('click', ()=>{
  const filas = PREGUNTAS.map((q,k)=>{ const r=E.respuestas[k];
    return '<tr><td>'+nombres(q.texto)+'</td><td>'+(!r?'sin responder':(r.primerIntento?'✔ al primer intento':'✘ primero; '+(r.resuelta?'resuelta releyendo':'pendiente')))+'</td><td>'+(r?r.intentos:0)+'</td></tr>'; }).join('');
  const pred = E.prediccion ? (E.prediccion.eleccion===PREDICCION.ok ? '✔ acertó' : '✘ eligió: '+nombres(PREDICCION.opciones[E.prediccion.eleccion])) : 'sin hacer';
  const toques = Object.entries(E.toques||{}).sort((a,b)=>b[1]-a[1]);
  $('#resumenPapa').innerHTML =
    '<p>Episodio '+EPISODIO+' · empezado: '+(E.inicio||'—')+' · terminado: '+(E.terminado||'no todavía')+' · veces que lo empezó: '+(E.sesiones||0)+'</p>'+
    '<p>Predicción: '+pred+'</p>'+
    '<table><tr><th>Pregunta</th><th>Resultado</th><th>Intentos</th></tr>'+filas+'</table>'+
    '<p><b>Caras de Coraline dibujadas</b>: '+(EMOCIONES.map(e=>{ const r=(E.emociones||{})[e.id];
      return e.nombre+(r?(r.dijoBien?' ✔ la nombró bien':' · la aprendieron juntos'):' · sin dibujar'); }).join(' — '))+'</p>'+
    '<p><b>Palabras que tocó para escucharlas</b> (las que le cuestan):<br>'+
    (toques.length ? toques.map(([w,n])=>w+' ('+n+')').join(', ') : 'ninguna todavía')+'</p>';
  mostrar('papa');
});
$('#volverPapa').addEventListener('click', irPortada);
$('#borrarPapa').addEventListener('click', ()=>{ E = nuevo(); guardar(); irPortada(); });

$('#ver').textContent = 'VERSIÓN ' + VERSION;
irPortada();
</script>
</body>
</html>
