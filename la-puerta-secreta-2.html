<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La puerta secreta 2 — el mapa de Coraline</title>
<style>
:root{
  --papel:#fff8ec; --tinta:#1f2a44; --rojo:#c8423b; --rosa:#e9658f; --rojo-suave:#fde3e6;
  --verde:#3f8f6b; --azul:#2f5fb3; --amarillo:#ffd93b; --amarillo-suave:#fff1a8; --gris:#8a93a8;
  --sombra:rgba(31,42,68,.18);
  --fuente:Verdana,"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif;
  /* Letra un poco menor que en el episodio 1: las viñetas traen más palabras. */
  --letra:clamp(24px,4.9vmin,44px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--papel);color:var(--tinta);font-family:var(--fuente)}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.pantalla{position:absolute;inset:0;display:none;flex-direction:column}
.pantalla.visible{display:flex}

/* ---------- portada ---------- */
#portada{flex-direction:row;align-items:center;justify-content:center;padding:2vmin 3vmin;gap:3vmin;
  background:radial-gradient(circle at 70% 40%,#d9f0ff,var(--papel) 62%)}
#portada .figuras{display:flex;align-items:flex-end;height:74vh;max-width:46vw}
#portada .figuras img{height:100%;width:auto;max-width:21vw;object-fit:contain;margin-left:-2vmin;filter:drop-shadow(0 6px 0 var(--sombra))}
#portada .figuras img:first-child{margin-left:0}
#portada .lado{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.8vmin;max-width:52vw}
#portada h1{font-size:clamp(30px,8.4vmin,80px);margin:0;color:var(--azul);line-height:1.05}
#portada .sub{font-size:clamp(18px,4.2vmin,38px);margin:0}
#portada .autora{font-size:clamp(13px,2.6vmin,22px);color:var(--gris);margin:0}
.grande{font-size:clamp(22px,5vmin,44px);font-weight:bold;border:0;border-radius:22px;
  padding:2vmin 5vmin;min-height:64px;box-shadow:0 5px 0 var(--sombra);color:#fff;background:var(--verde)}
.grande:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sombra)}
.grande.claro{background:#fff;color:var(--verde);border:4px solid var(--verde)}
.discreto{background:none;border:2px solid var(--gris);color:var(--gris);border-radius:14px;
  font-size:clamp(14px,2.6vmin,22px);padding:8px 14px;min-height:44px}
.fila{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;align-items:center}
#estadoVoz{font-size:clamp(13px,2.4vmin,20px);color:var(--gris);margin:0}
.version{font-size:12px;color:var(--gris);letter-spacing:1px}

/* ---------- videos hechos con código ---------- */
#intro,#viaje{background:#171a33;align-items:center;justify-content:center;overflow:hidden}
#intro .titulo{position:absolute;top:7%;width:100%;text-align:center;color:#ffe9a8;font-size:clamp(28px,8vmin,78px);
  font-weight:bold;opacity:0;animation:aparecer 1.2s 3.4s forwards;text-shadow:0 4px 0 rgba(0,0,0,.4);z-index:2}
#saltarIntro,#saltarViaje{position:absolute;right:2vmin;bottom:2vmin;z-index:5;background:rgba(255,255,255,.14);color:#fff;border-color:#fff}
@keyframes aparecer{to{opacity:1}}
#escenaViaje{position:absolute;inset:0}
#escenaViaje svg{position:absolute;inset:0;width:100%;height:100%}
.cuadroViaje{animation:alejar 2.7s ease-out both}
@keyframes alejar{0%{transform:scale(2.3);opacity:0}18%{opacity:1}100%{transform:scale(1);opacity:1}}
#rotuloViaje{position:absolute;left:0;right:0;bottom:6%;text-align:center;z-index:3;font-weight:bold;
  font-size:clamp(28px,8vmin,76px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55)}

/* ---------- viñeta ---------- */
#vineta{padding:1.4vmin 2vmin;gap:1.4vmin}
#barra{display:flex;align-items:center;gap:12px;font-size:clamp(14px,2.8vmin,24px);color:var(--gris);min-height:44px}
#barra .puntos{display:flex;gap:5px;flex:1;flex-wrap:wrap}
#barra .punto{width:12px;height:12px;border-radius:50%;background:#e8dcc4}
#barra .punto.hecho{background:var(--azul)}
#cuerpo{flex:1;display:flex;gap:2vmin;min-height:0}
#dibujo{flex:1 1 48%;border:5px solid var(--tinta);border-radius:18px;background:#fff;overflow:hidden;position:relative}
#dibujo > svg.fondo{position:absolute;inset:0;width:100%;height:100%}
#dibujo .pj{position:absolute;bottom:0;height:78%;width:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
#texto{flex:1 1 52%;display:flex;flex-direction:column;border:5px solid var(--tinta);border-radius:18px;
  background:#fff;padding:2vmin 2.6vmin;overflow:auto}
#quien{font-size:clamp(16px,3.2vmin,28px);font-weight:bold;color:var(--azul);margin-bottom:1vmin;min-height:1em}
#frase{font-size:var(--letra);line-height:1.5;word-spacing:.12em;letter-spacing:.01em}
.pal{border-radius:8px;padding:0 .06em;cursor:pointer}
.pal:active,.pal.sonando{background:var(--amarillo-suave)}
.pal.pista{background:var(--rojo-suave);box-shadow:0 0 0 3px var(--rojo);border-radius:6px}
#ayudaToque{margin-top:auto;padding-top:1vmin;font-size:clamp(13px,2.4vmin,20px);color:var(--gris)}
#pie{display:flex;align-items:center;gap:2vmin}
.flecha{width:clamp(64px,14vmin,120px);min-height:clamp(56px,11vmin,96px);border:0;border-radius:18px;
  font-size:clamp(26px,6vmin,52px);color:#fff;background:var(--azul);box-shadow:0 5px 0 var(--sombra)}
.flecha:disabled{background:#cfd6e2;box-shadow:none}
#escuchar{flex:1;min-height:clamp(56px,11vmin,96px);border:4px solid var(--azul);background:#fff;color:var(--azul);
  border-radius:18px;font-size:clamp(17px,3.6vmin,32px);font-weight:bold}
#escuchar:disabled{border-color:#cfd6e2;color:var(--gris)}

/* ---------- animaciones de las viñetas ---------- */
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes brillo{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes correr{from{left:-70%}to{left:105%}}
@keyframes rebote{0%,100%{transform:translateY(0)}40%{transform:translateY(-14%)}}
@keyframes ola{0%,100%{transform:translateX(0)}50%{transform:translateX(-18px)}}
@keyframes subeOla{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes entrar{from{transform:translateY(12%);opacity:0}to{transform:none;opacity:1}}
@keyframes temblor{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5%)}75%{transform:translateX(1.5%)}}
@keyframes clavar{0%{transform:translateY(-40px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:none;opacity:1}}
@keyframes desplegar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}
@keyframes rayos{from{opacity:0}to{opacity:1}}
@keyframes sacudir{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.flota{animation:flotar 2.6s ease-in-out infinite}
.brilla{animation:brillo 1.6s ease-in-out infinite}
.ola{animation:ola 3s ease-in-out infinite}
.sube{animation:subeOla 2.4s ease-in-out infinite}
.gira{transform-origin:50% 50%;transform-box:fill-box;animation:girar 14s linear infinite}
.pin{transform-box:fill-box;animation:clavar .8s ease-out both}
.despliega{transform-origin:50% 50%;transform-box:fill-box;animation:desplegar 1.4s ease-out both}
.rayos{opacity:0;animation:rayos 2s .4s forwards}
.sacude{transform-origin:50% 100%;transform-box:fill-box;animation:sacudir .5s ease-in-out infinite}
.pj.corre{animation:correr 3.4s linear infinite;left:-70%}
.pj.salta{animation:rebote .9s ease-in-out infinite}
.pj.entra{animation:entrar .7s ease-out both}
.pj.tiembla{animation:temblor .25s linear infinite}

/* ---------- burbuja de sílabas ---------- */
#silabas{position:absolute;left:50%;top:10%;transform:translateX(-50%);z-index:30;display:none;
  background:var(--amarillo-suave);border:5px solid var(--tinta);border-radius:22px;padding:1.5vmin 4vmin;
  font-size:clamp(34px,9vmin,84px);font-weight:bold;letter-spacing:.06em;box-shadow:0 6px 0 var(--sombra);white-space:nowrap}
#silabas.visible{display:block}
#silabas .sep{color:var(--rojo);padding:0 .12em}

/* ---------- pregunta ---------- */
#pregunta{padding:2.2vmin 3vmin;gap:1.8vmin;align-items:center;justify-content:center}
#pregunta .tipo{font-size:clamp(15px,3vmin,26px);color:var(--rosa);font-weight:bold;letter-spacing:1px}
#pregunta h2{font-size:var(--letra);margin:0;text-align:center;line-height:1.3;max-width:1100px}
#opciones{display:flex;flex-direction:column;gap:1.4vmin;width:100%;max-width:1100px}
.opcion{border:5px solid var(--azul);background:#fff;border-radius:18px;text-align:left;
  font-size:clamp(20px,4.4vmin,40px);padding:1.2vmin 2.4vmin;min-height:clamp(54px,10.5vmin,96px);color:var(--tinta);line-height:1.3}
.opcion:disabled{opacity:.55}
.opcion.bien{border-color:var(--verde);background:#e3f4ea;opacity:1}

/* ---------- mensajes ---------- */
#mensaje{flex-direction:row;align-items:center;justify-content:center;padding:3vmin;gap:3vmin}
#mensaje img{height:62vh;width:auto;max-width:34vw;object-fit:contain}
#mensaje .lado{display:flex;flex-direction:column;align-items:center;gap:3vmin;max-width:900px}
#mensaje p{font-size:var(--letra);margin:0;line-height:1.45;text-align:center}
#mensaje .cita{font-style:italic;color:var(--rojo)}

/* ---------- final en papel ---------- */
#final{align-items:center;justify-content:center;text-align:center;padding:3vmin;gap:2.2vmin}
#final .hoja{border:5px dashed var(--tinta);border-radius:18px;padding:2.2vmin 4vmin;background:#fff;max-width:1100px}
#final p{font-size:var(--letra);margin:0;line-height:1.45}
#final .lapices{font-size:clamp(34px,9vmin,80px)}

/* ---------- ordenar los lugares ---------- */
#orden{padding:2.2vmin 3vmin;gap:1.6vmin;align-items:center}
#orden .tipo{font-size:clamp(15px,3vmin,26px);color:var(--rosa);font-weight:bold;letter-spacing:1px}
#orden h2{font-size:clamp(20px,4.4vmin,40px);margin:0;text-align:center;line-height:1.3}
#tarjetas{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vmin;width:100%;max-width:1300px;min-height:0}
.tarjeta{position:relative;border:5px solid var(--azul);border-radius:18px;background:#fff;padding:0;overflow:hidden;
  display:flex;flex-direction:column;color:var(--tinta)}
.tarjeta svg{flex:1;width:100%;min-height:0}
.tarjeta span{font-size:clamp(16px,3.4vmin,30px);font-weight:bold;padding:.6vmin 0}
.tarjeta .num{position:absolute;top:6px;left:6px;width:clamp(34px,7vmin,60px);height:clamp(34px,7vmin,60px);border-radius:50%;
  background:var(--verde);color:#fff;font-size:clamp(20px,4.4vmin,38px);font-weight:bold;display:none;align-items:center;justify-content:center}
.tarjeta.bien{border-color:var(--verde);background:#e3f4ea}
.tarjeta.bien .num{display:flex}
.tarjeta.mal{animation:temblor .25s linear 3;border-color:var(--rojo)}

/* ---------- explicar a papá y mamá ---------- */
#explica{flex-direction:row;align-items:center;gap:3vmin;padding:2.4vmin 3vmin}
#explica img{height:66vh;width:auto;max-width:30vw;object-fit:contain}
#explica .lado{flex:1;display:flex;flex-direction:column;gap:2.4vmin}
#explica .paso{font-size:clamp(15px,3vmin,26px);color:var(--rosa);font-weight:bold;letter-spacing:1px}
#explica .txt{font-size:var(--letra);line-height:1.45}
#explica .fila{justify-content:flex-start}

/* ---------- para papá ---------- */
#papa{padding:3vmin;gap:1.4vmin;overflow:auto;font-size:clamp(15px,2.8vmin,24px)}
#papa h2{margin:0}
#papa table{border-collapse:collapse;width:100%;max-width:1000px}
#papa td,#papa th{border-bottom:1px solid #e8dcc4;padding:6px 8px;text-align:left}

@media (orientation:portrait){
  #cuerpo{flex-direction:column}
  #dibujo{flex:1 1 42%}
  #texto{flex:1 1 58%}
  #portada,#mensaje,#explica{flex-direction:column}
  #portada .figuras{height:36vh;max-width:90vw}
  #portada .lado{max-width:92vw}
  #mensaje img,#explica img{height:28vh;max-width:70vw}
  #tarjetas{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<!-- PORTADA -->
<section id="portada" class="pantalla visible">
  <div class="figuras" id="figurasPortada"></div>
  <div class="lado">
    <h1>La puerta secreta</h1>
    <p class="sub" id="subtitulo"></p>
    <div class="fila">
      <button class="grande" id="empezar">Empezar a leer</button>
      <button class="grande" id="seguir" style="display:none;background:var(--azul)">Seguir donde iba</button>
    </div>
    <p class="autora">Coraline, el personaje de Mia, dibujada por Mia</p>
    <p id="estadoVoz"></p>
    <div class="fila"><button class="discreto" id="verIntro">Ver el video</button>
      <button class="discreto" id="verViaje">Ver el viaje</button>
      <button class="discreto" id="verPapa">Para papá</button></div>
    <span class="version" id="ver"></span>
  </div>
</section>

<!-- VIDEO DE ENTRADA -->
<section id="intro" class="pantalla">
  <div class="titulo">El mapa escondido</div>
  <div id="escenaIntro" style="position:absolute;inset:0"></div>
  <button class="discreto" id="saltarIntro">Saltar ▶</button>
</section>

<!-- VIDEO DEL VIAJE: de la playa al espacio -->
<section id="viaje" class="pantalla">
  <div id="escenaViaje"></div>
  <div id="rotuloViaje"></div>
  <button class="discreto" id="saltarViaje">Saltar ▶</button>
</section>

<!-- VIÑETA -->
<section id="vineta" class="pantalla">
  <div id="barra"><span id="numVineta"></span><div class="puntos" id="puntos"></div>
    <button class="discreto" id="salir">Salir</button></div>
  <div id="cuerpo">
    <div id="dibujo"></div>
    <div id="texto">
      <div id="quien"></div>
      <div id="frase"></div>
      <div id="ayudaToque">Toca una palabra difícil para escucharla.</div>
    </div>
  </div>
  <div id="pie">
    <button class="flecha" id="atras" aria-label="Viñeta anterior">◀</button>
    <button id="escuchar">🔊 Primero léela tú</button>
    <button class="flecha" id="adelante" aria-label="Viñeta siguiente">▶</button>
  </div>
  <div id="silabas"></div>
</section>

<!-- PREGUNTA -->
<section id="pregunta" class="pantalla">
  <div class="tipo" id="tipoPregunta"></div>
  <h2 id="textoPregunta"></h2>
  <div id="opciones"></div>
</section>

<!-- MENSAJE -->
<section id="mensaje" class="pantalla">
  <img id="caraMensaje" alt="">
  <div class="lado"><p id="textoMensaje"></p><button class="grande" id="botonMensaje">Seguir</button></div>
</section>

<!-- FINAL EN PAPEL: Mia dibuja los fondos -->
<section id="final" class="pantalla">
  <div class="lapices">✏️🖍️📄📄</div>
  <div class="hoja"><p id="textoFinal"></p></div>
  <button class="grande" id="yaDibuje">¡Ya los dibujé!</button>
</section>

<!-- ORDENAR LOS LUGARES -->
<section id="orden" class="pantalla">
  <div class="tipo">DE ADENTRO HACIA AFUERA</div>
  <h2 id="textoOrden"></h2>
  <div id="tarjetas"></div>
</section>

<!-- EXPLICAR CON LOS DIBUJOS -->
<section id="explica" class="pantalla">
  <img id="caraExplica" alt="">
  <div class="lado">
    <div class="paso">CUÉNTASELO A PAPÁ Y MAMÁ</div>
    <div class="txt" id="textoExplica"></div>
    <div class="fila" id="botonesExplica"></div>
  </div>
</section>

<!-- PARA PAPÁ -->
<section id="papa" class="pantalla">
  <h2>Para papá: cómo va Mia</h2>
  <div id="resumenPapa"></div>
  <div class="fila" style="justify-content:flex-start"><button class="discreto" id="volverPapa">Volver</button>
       <button class="discreto" id="borrarPapa">Empezar de cero</button></div>
</section>

<!-- Audios grabados (MP3) de cada viñeta y cada palabra: el Echo no trae voz del navegador. -->
<script src="la-puerta-secreta-2/audio/manifiesto.js"></script>
<script>
"use strict";
/* =====================================================================
   LA PUERTA SECRETA, EPISODIO 2 — El mapa escondido
   Lectura (inferencia, predicción) + geografía básica: de la playa de
   Punta Hermosa y el Parque Pecanas (San Isidro) a Lima, el Perú,
   América del Sur, la Tierra, y fuera de ella el Sol y la Luna.
   Diseño: ver historieta-episodio-2-propuesta.md (2026-11-17).
   · Coraline sale con las cinco caras que dibujó Mia el 2026-11-17.
   · Repaso del episodio 1 al empezar.
   · Coraline se equivoca (cava junto al agua) y vence releyendo la nota.
   · Final en papel: Mia dibuja los fondos de la playa y del parque.
   · Después ordena los lugares de adentro hacia afuera y lo explica.
   ===================================================================== */
const VERSION = '1.0';
const EPISODIO = 2;
const CLAVE = 'mia_puerta_secreta_ep' + EPISODIO;
const IMG = 'la-puerta-secreta-2/';

/* ---------- PERSONAJES ---------- */
const P = { cora:'Coraline', abuela:'Helena', gato:'Pelusa', nota:'La nota' };
/* Caras: las que empiezan con "mia-" las dibujó Mia (2026-11-17); las otras salen de la hoja de expresiones. */
const CARA = n => IMG + 'caras/' + n + '.webp';

/* ---------- EL EPISODIO (unas 400 palabras) ---------- */
const VINETAS = [
  { quien:'', escena:'cuartito', cara:'mia-sorprendida',
    texto:'La puerta secreta está abierta. Adentro hay un cuarto muy pequeño, como una caja. En el piso brilla otra llave. Al lado hay un papel doblado.' },
  { quien:'abuela', escena:'mapa', cara:'mia-feliz',
    texto:'¡Es un mapa, {cora}! Y tiene una nota escondida. Léela tú, con calma. Una buena detective lee despacio.' },
  { quien:'nota', escena:'nota1', cara:'',
    texto:'La nota dice: «Esta llave abre un cofre. Busca donde el mar toca la arena, debajo de la sombrilla roja».' },
  { quien:'cora', escena:'idea', cara:'pensativa',
    texto:'El mar toca la arena en la playa. ¡Vamos a la playa de Punta Hermosa!' },
  { quien:'', escena:'playa', cara:'corriendo', anim:'corre',
    texto:'{cora}, la abuela {abuela} y {gato} llegan a Punta Hermosa. Hay olas grandes, arena caliente y muchas sombrillas de colores.' },
  { quien:'', escena:'hueco', cara:'mia-enojada',
    texto:'{cora} cava junto al agua. Pero las olas tapan el hueco una y otra vez. ¡Ahí no hay ningún cofre! {cora} está enojada.' },
  { quien:'cora', escena:'idea', cara:'pensativa',
    texto:'Voy a leer la nota otra vez... ¡Debajo de la sombrilla roja! No dice junto al agua.' },
  { quien:'', escena:'sombrilla', cara:'saltando', anim:'salta',
    texto:'Debajo de la sombrilla roja, la arena está fresca. {cora} cava un poco y encuentra un cofre azul. La llave entra y gira. ¡Clic!' },
  { quien:'nota', escena:'nota2', cara:'',
    texto:'Dentro del cofre hay otra nota: «Ahora busca el parque que tiene nombre de nuez. Está en San Isidro».' },
  { quien:'abuela', escena:'abuela', cara:'mia-feliz',
    texto:'¡Las pecanas son unas nueces! Es el Parque Pecanas, en San Isidro. Vamos en el carro.' },
  { quien:'', escena:'parque', cara:'mia-asustada', anim:'tiembla',
    texto:'En el parque hay árboles altos y bancas. Un perro grande ladra: ¡guau! {cora} se asusta un poquito. {gato} no se asusta: mira debajo de una banca.' },
  { quien:'', escena:'globo', cara:'mia-sorprendida',
    texto:'Debajo de la banca hay un globo terráqueo pequeñito. Es la Tierra en chiquito. La abuela dice: la playa y el parque están lejos, pero los dos están en Lima.' },
  { quien:'', escena:'lima', cara:'',
    texto:'Lima es una ciudad muy grande, junto al mar. En el mapa, San Isidro está arriba, al norte. Punta Hermosa está abajo, al sur.' },
  { quien:'', escena:'peru', cara:'',
    texto:'Lima está dentro del Perú. El Perú es un país grande. Tiene mar en la costa, montañas en la sierra y árboles en la selva.' },
  { quien:'', escena:'sudamerica', cara:'',
    texto:'El Perú está dentro de América del Sur. Sus vecinos son Ecuador, Colombia, Brasil, Bolivia y Chile.' },
  { quien:'', escena:'tierra', cara:'',
    texto:'América del Sur está en la Tierra, nuestro mundo. La Tierra es redonda como una pelota y tiene mucha agua. Desde el espacio se ve azul.' },

/* =====================================================================
   SÍLABAS: se parten solas con las reglas del español.
   ===================================================================== */
const EXCEPCIONES = { 'coraline':'Co-ra-li-ne', 'helena':'He-le-na', 'pelusa':'Pe-lu-sa', 'guau':'guau' };
function silabear(w){
  if(EXCEPCIONES[w]) return EXCEPCIONES[w];
  const fuerte = c => 'aeoáéóíú'.includes(c);
  const vocal = (c, k, s) => 'aeiouáéíóúü'.includes(c) || (c==='y' && k===s.length-1 && k>0);
  const s = w;
  /* qu y gu antes de e/i: la u no suena, va con la consonante */
  const esVocal = k => {
    const c = s[k];
    if(c==='u' && k>0 && (s[k-1]==='q' || s[k-1]==='g') && 'eiéí'.includes(s[k+1]||'')) return false;
    return vocal(c, k, s);
  };
  const nucleos = [];  // [inicio, fin] de cada grupo de vocales que forman una sílaba
  let k = 0;
  while(k < s.length){
    if(esVocal(k)){
      let fin = k;
      while(fin+1 < s.length && esVocal(fin+1)){
        const a = s[fin], b = s[fin+1];
        const hiato = (fuerte(a) && fuerte(b)) || 'íú'.includes(a) || 'íú'.includes(b);
        if(hiato) break;
        fin++;
      }
      nucleos.push([k, fin]); k = fin+1;
    } else k++;
  }
  if(nucleos.length < 2) return s;
  const inseparable = ['pr','br','tr','dr','cr','gr','fr','pl','bl','cl','gl','fl','ch','ll','rr','qu','gu'];
  const cortes = [];
  for(let n=0; n<nucleos.length-1; n++){
    const a = nucleos[n][1]+1, b = nucleos[n+1][0];
    const cons = s.slice(a, b);
    let corte;
    if(cons.length === 0) corte = a;
    else if(cons.length === 1) corte = a;
    else if(cons.length === 2) corte = inseparable.includes(cons) ? a : a+1;
    else if(cons.length === 3) corte = inseparable.includes(cons.slice(1)) ? a+1 : a+2;
    else corte = a+2;
    cortes.push(corte);
  }
  const partes = []; let ini = 0;
  cortes.forEach(c=>{ partes.push(s.slice(ini, c)); ini = c; });
  partes.push(s.slice(ini));
  return partes.join('-');
}

function proyector(caja, lon0, lon1, lat0, lat1){
  const [x,y,w,h] = caja;
  const s = Math.min(w/(lon1-lon0), h/(lat1-lat0));
  const ox = x + (w - (lon1-lon0)*s)/2, oy = y + (h - (lat1-lat0)*s)/2;
  const p = ([lon,lat]) => [ox + (lon-lon0)*s, oy + (lat1-lat)*s];
  p.d = pts => 'M' + pts.map(q=>p(q).map(v=>v.toFixed(1)).join(' ')).join(' L') + ' Z';
  return p;
}
function tierraOrto(cx, cy, R, lon0, lat0, conOtros=true, resaltarPeru=false){
  const rad = Math.PI/180, sl0 = Math.sin(lat0*rad), cl0 = Math.cos(lat0*rad);
  const pt = ([lon,lat]) => { const la=lat*rad, dl=(lon-lon0)*rad;
    const cosc = sl0*Math.sin(la) + cl0*Math.cos(la)*Math.cos(dl);
    if(cosc < 0) return null;
    return [cx + R*Math.cos(la)*Math.sin(dl), cy - R*(cl0*Math.sin(la) - sl0*Math.cos(la)*Math.cos(dl))]; };
  const d = pts => { const v = pts.map(pt).filter(Boolean); return v.length>2 ? 'M'+v.map(q=>q.map(n=>n.toFixed(1)).join(' ')).join(' L')+' Z' : ''; };
  return (conOtros ? `<path d="${d(NORTEAMERICA)}" fill="#7cc47f"/><path d="${d(AFRICA)}" fill="#7cc47f"/>` : '') +
    `<path d="${d(SUDAMERICA)}" fill="${conOtros ? '#ffd93b' : '#7cc47f'}" stroke="${conOtros ? '#c8423b' : 'none'}" stroke-width="${R/60}"/>` +
    (resaltarPeru ? `<path d="${d(PERU)}" fill="#e9658f"/>` : '');
}

/* =================== VOZ (MP3 grabados; el Echo no trae voz del navegador) =================== */
const AUDIO = window.AUDIO_MIA || { vinetas:{}, palabras:{} };
const Voz = (function(){
  let voz = null;
  const reproductor = new Audio(); reproductor.preload = 'auto';
  window.__reproductorMia = reproductor;
  const hay = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  function elegir(){
    if(!hay) return;
    const vs = window.speechSynthesis.getVoices() || [];
    voz = vs.find(v=>/^es[-_](US|MX|419|PE)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
    setTimeout(pintarEstado, 0);
  }
  if(hay){ elegir(); window.speechSynthesis.onvoiceschanged = elegir; }
  function sonar(archivo){
    return new Promise((res, rej)=>{
      let listo=false; const fin=(ok)=>{ if(!listo){ listo=true; reproductor.onended=reproductor.onerror=null; ok?res():rej(); } };
      try{
        reproductor.pause();
        reproductor.src = IMG + archivo;
        reproductor.onended = ()=>fin(true);
        reproductor.onerror = ()=>fin(false);
        const p = reproductor.play();
        if(p && p.catch) p.catch(()=>fin(false));
        setTimeout(()=>fin(true), 25000);
      }catch(e){ fin(false); }
    });
  }
  function decir(texto, lento){
    return new Promise(res=>{
      if(!hay){ res(); return; }
      let listo=false; const fin=()=>{ if(!listo){ listo=true; res(); } };
      try{
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(texto);
        u.lang = voz ? voz.lang : 'es-US';
        if(voz) u.voice = voz;
        u.rate = lento ? 0.7 : 0.88; u.pitch = 1.05;
        u.onend = fin; u.onerror = fin;
        setTimeout(fin, 1500 + texto.length * 110);
        window.speechSynthesis.speak(u);
      }catch(e){ fin(); }
    });
  }
  const grabadoODicho = (archivo, texto, lento) => archivo ? sonar(archivo).catch(()=>decir(texto, lento)) : decir(texto, lento);
  return {
    grabado: ()=>Object.keys(AUDIO.palabras||{}).length>0,
    conVoz: ()=>Object.keys(AUDIO.palabras||{}).length>0 || (hay && voz!==null),
    palabra: (limpia, silabas)=>grabadoODicho((AUDIO.palabras||{})[limpia], silabas.split('-').length>1 ? silabas.split('-').join(', ')+'. '+limpia : limpia, true),
    vineta: (n, texto)=>grabadoODicho((AUDIO.vinetas||{})[n], texto, false)
  };
})();
function pintarEstado(){
  $('#estadoVoz').textContent = Voz.grabado() ? '🔊 Audio listo' : '🔊 Sin audio grabado: se usará la voz del aparato.';
}
/* Para el generador de audio: todo lo que Mia puede escuchar */
function textosParaAudio(){
  const vin = VINETAS.map(v=>nombres(v.texto));
  const pals = {};
  vin.forEach(t=>palabras(t).forEach(w=>{ const l=normal(w); if(l) pals[l] = silabear(l); }));
  return { vinetas: vin, palabras: pals };
}

/* =================== VIÑETAS =================== */
let i = 0, reloj = null, relojVoz = null;
let pistaMarcada = null;
let volverAPregunta = null;

function pintarVineta(){
  const v = VINETAS[i];
  $('#puntos').innerHTML = VINETAS.map((x,k)=>'<span class="punto'+(k<=i?' hecho':'')+'"></span>').join('');
  $('#numVineta').textContent = 'Viñeta ' + (i+1) + ' de ' + VINETAS.length;
  $('#quien').textContent = v.quien ? P[v.quien] + ':' : '';
  const frase = $('#frase'); frase.innerHTML='';
  palabras(v.texto).forEach(w=>{
    const s=document.createElement('span'); s.className='pal'; s.textContent=w;
    s.addEventListener('click', ()=>tocarPalabra(s, w));
    frase.appendChild(s); frase.appendChild(document.createTextNode(' '));
  });
  if(pistaMarcada) marcarPista(pistaMarcada);
  pintarEscena(v);
  const n = palabras(v.texto).length;
  const tSig = Math.max(3, Math.round(n*0.35)) * 1000;
  const tVoz = Math.max(6, Math.round(n*0.6)) * 1000;
  $('#atras').disabled = (i===0) || volverAPregunta!==null;
  $('#adelante').disabled = true;
  $('#escuchar').disabled = true; $('#escuchar').textContent='🔊 Primero léela tú';
  clearTimeout(reloj); clearTimeout(relojVoz);
  reloj = setTimeout(()=>{ $('#adelante').disabled=false; }, volverAPregunta!==null ? Math.max(4000,tSig) : tSig);
  relojVoz = setTimeout(()=>{ $('#escuchar').disabled=false; $('#escuchar').textContent='🔊 Escuchar la viñeta'; }, tVoz);
  E.vineta = i; guardar();
}
function marcarPista(pista){
  const objetivo = palabras(pista).map(normal);
  const spans = [...document.querySelectorAll('#frase .pal')];
  for(let a=0;a<=spans.length-objetivo.length;a++){
    if(objetivo.every((w,k)=>normal(spans[a+k].textContent)===w)){
      for(let k=0;k<objetivo.length;k++) spans[a+k].classList.add('pista');
      return;
    }
  }
}
function tocarPalabra(span, w){
  const limpia = normal(w); if(!limpia) return;
  E.toques[limpia] = (E.toques[limpia]||0) + 1; guardar();
  const sil = silabear(limpia);
  const b=$('#silabas');
  b.innerHTML = sil.split('-').map(x=>'<span>'+x+'</span>').join('<span class="sep">·</span>');
  b.classList.add('visible'); span.classList.add('sonando');
  Voz.palabra(limpia, sil).then(()=>{
    setTimeout(()=>{ b.classList.remove('visible'); span.classList.remove('sonando'); }, Voz.conVoz()?300:1800);
  });
}
$('#escuchar').addEventListener('click', ()=>{
  const spans=[...document.querySelectorAll('#frase .pal')];
  spans.forEach(s=>s.classList.add('sonando'));
  Voz.vineta(i+1, nombres(VINETAS[i].texto)).then(()=>spans.forEach(s=>s.classList.remove('sonando')));
});
$('#atras').addEventListener('click', ()=>{ if(i>0){ i--; pistaMarcada=null; pintarVineta(); } });
$('#adelante').addEventListener('click', avanzar);
$('#salir').addEventListener('click', irPortada);

function avanzar(){
  if(volverAPregunta!==null){ const q=volverAPregunta; volverAPregunta=null; pistaMarcada=null; hacerPregunta(q, true); return; }
  if(i+1 === PREDICCION.antesDe && E.prediccion && E.prediccion.comprobada!==true){
    E.prediccion.comprobada = true; guardar();
    const ok = E.prediccion.eleccion === PREDICCION.ok;
    mensaje(nombres(ok ? PREDICCION.bien : PREDICCION.mal), ok ? 'mia-feliz' : 'pensativa', ()=>{ i++; siguiente(); });
    return;
  }
  i++; siguiente();
}
function siguiente(){
  if(i === PREDICCION.antesDe - 1 && !E.prediccion){ i = PREDICCION.antesDe - 2; predecir(); return; }
  if(i >= VINETAS.length){ i = VINETAS.length-1; verViaje(empezarPreguntas); return; }
  pintarVineta(); mostrar('vineta');
}

  const box=$('#opciones'); box.innerHTML='';
  PREDICCION.opciones.forEach((o,k)=>{
    const b=document.createElement('button'); b.className='opcion'; b.textContent=nombres(o);
    b.addEventListener('click', ()=>{
      E.prediccion = { eleccion:k, comprobada:false }; guardar();
      i = PREDICCION.antesDe - 1; pintarVineta(); mostrar('vineta');
    });
    box.appendChild(b);
  });
  mostrar('pregunta');
}

/* =================== PREGUNTAS (la puerta) =================== */
function empezarPreguntas(){
  const pend = PREGUNTAS.findIndex((q,k)=>!E.respuestas[k] || !E.respuestas[k].resuelta);
  if(pend<0){ irFinal(); return; }
  hacerPregunta(pend, false);
}
function hacerPregunta(k, esReintento){
  const q=PREGUNTAS[k];
  $('#tipoPregunta').textContent = q.tipo + (esReintento ? ' · OTRA VEZ' : '');
  $('#textoPregunta').textContent = nombres(q.texto);
  const box=$('#opciones'); box.innerHTML='';
  q.opciones.forEach((o,n)=>{
    const b=document.createElement('button'); b.className='opcion'; b.textContent=nombres(o);
    b.addEventListener('click', ()=>{
      box.querySelectorAll('button').forEach(x=>x.disabled=true);
      const r = E.respuestas[k] || { primerIntento:null, intentos:0, resuelta:false };
      r.intentos++;
      if(r.primerIntento===null) r.primerIntento = (n===q.ok);
      E.respuestas[k]=r;
      if(n===q.ok){
        r.resuelta=true; guardar(); b.classList.add('bien');
        setTimeout(()=>mensaje(nombres(q.bien), 'riendo', empezarPreguntas), 500);
      }else{
        guardar();
        mensaje('Vamos a buscar la pista en el cuento. Lee otra vez la parte marcada.', 'pensativa', ()=>{
          i = q.vineta-1; pistaMarcada = q.pista; volverAPregunta = k;
          pintarVineta(); mostrar('vineta');
        });
      }
    });
    box.appendChild(b);
  });
  mostrar('pregunta');
}

/* =================== MENSAJES Y FINAL EN PAPEL =================== */
function mensaje(texto, cara, despues){
  $('#textoMensaje').innerHTML = texto.replace(/«([^»]+)»/g,'<span class="cita">«$1»</span>');
  $('#caraMensaje').src = CARA(cara || 'mia-feliz');
  $('#botonMensaje').onclick = despues;
  mostrar('mensaje');
}
function irFinal(){ $('#textoFinal').textContent = nombres(FINAL); mostrar('final'); }
$('#yaDibuje').addEventListener('click', ()=>{ E.dibujoFondos = hoy(); guardar(); ordenar(); });

/* =================== ORDENAR: de adentro hacia afuera =================== */
const MINI = { playa:'playa', lima:'lima', peru:'peru', sa:'sudamerica', tierra:'tierra', espacio:'solLuna' };
function ordenar(){
  $('#textoOrden').textContent = 'Toca los lugares en orden: empieza en la playa y el parque, y sal hasta el espacio.';
  const box = $('#tarjetas'); box.innerHTML = '';
  const mezcla = [3,0,5,1,4,2];   /* siempre la misma mezcla, para comparar entre días */
  let siguiente = 0;
  E.orden = { errores:0, terminado:null }; guardar();
  mezcla.forEach(n=>{
    const L = LUGARES[n];
    const b = document.createElement('button'); b.className = 'tarjeta';
    b.innerHTML = '<div class="num">' + (n+1) + '</div>' + svgEscena(MINI[L.id]) + '<span>' + L.nombre + '</span>';
    b.addEventListener('click', ()=>{
      if(b.classList.contains('bien')) return;
      if(n === siguiente){
        b.classList.add('bien'); siguiente++;
        if(siguiente === LUGARES.length){
          E.orden.terminado = hoy(); guardar();
          setTimeout(()=>mensaje('¡Muy bien! Fuiste de adentro hacia afuera: la playa y el parque, Lima, el Perú, América del Sur, la Tierra, y afuera el Sol y la Luna.', 'mia-feliz', explicar), 700);
        }
      }else{
        E.orden.errores++; guardar();
        b.classList.remove('mal'); void b.offsetWidth; b.classList.add('mal');
      }
    });
    box.appendChild(b);
  });
  mostrar('orden');
}

/* =================== EXPLICAR CON LOS DIBUJOS =================== */
function explicar(){
  $('#caraExplica').src = CARA('mia-feliz');
  $('#textoExplica').textContent = 'Muéstrales tus dos dibujos a papá y mamá. Explícales: la playa y el parque están en Lima. Lima está en el Perú. ¿Y el Perú? ¿Y la Tierra?';
  const bot = $('#botonesExplica'); bot.innerHTML = '';
  const marcar = sola => { E.explico = { sola:sola, cuando:hoy() }; guardar(); terminarTodo(); };
  bot.appendChild(boton('✔ Lo explicó sola', '', ()=>marcar(true)));
  bot.appendChild(boton('Lo explicamos juntos', 'claro', ()=>marcar(false)));
  mostrar('explica');
}
function boton(texto, clase, accion){
  const b=document.createElement('button'); b.className='grande'+(clase?' '+clase:''); b.textContent=texto; b.onclick=accion; return b;
}
function terminarTodo(){
  E.terminado = hoy(); guardar();
  const aciertos = PREGUNTAS.filter((q,k)=>E.respuestas[k] && E.respuestas[k].primerIntento).length;
  mensaje('¡Encontraste el cofre y viajaste hasta la Luna! Encontraste ' + aciertos + ' de ' + PREGUNTAS.length +
    ' pistas al primer intento. Pídele a papá una foto de tus dibujos.', 'saludando', irPortada);
}

/* =================== PORTADA =================== */
function irPortada(){
  $('#subtitulo').textContent = 'Episodio ' + EPISODIO + ': El mapa escondido';
  $('#seguir').style.display = (E.inicio && !E.terminado) ? '' : 'none';
  $('#empezar').textContent = E.terminado ? 'Leer otra vez' : 'Empezar a leer';
  pintarEstado(); mostrar('portada');
}
$('#figurasPortada').innerHTML = ['mia-feliz','mia-sorprendida'].map(n=>'<img alt="Coraline dibujada por Mia" src="'+CARA(n)+'">').join('');
function arrancar(){
  const toques=E.toques||{}; const sesiones=(E.sesiones||0)+1;
  E = nuevo(); E.toques=toques; E.sesiones=sesiones; E.inicio=hoy(); E.vioIntro=true;
  guardar(); i=0; pistaMarcada=null; volverAPregunta=null;
  repasar(()=>{ pintarVineta(); mostrar('vineta'); });
}
$('#empezar').addEventListener('click', ()=>{ if(!E.vioIntro){ verIntro(arrancar); } else arrancar(); });
$('#seguir').addEventListener('click', ()=>{ i=E.vineta||0; pintarVineta(); mostrar('vineta'); });
$('#verIntro').addEventListener('click', ()=>verIntro(irPortada));
$('#verViaje').addEventListener('click', ()=>verViaje(irPortada));

/* ---------- Para papá ---------- */
$('#verPapa').addEventListener('click', ()=>{
  const filas = PREGUNTAS.map((q,k)=>{ const r=E.respuestas[k];
    return '<tr><td>'+nombres(q.texto)+'</td><td>'+(!r?'sin responder':(r.primerIntento?'✔ al primer intento':'✘ primero; '+(r.resuelta?'resuelta releyendo':'pendiente')))+'</td><td>'+(r?r.intentos:0)+'</td></tr>'; }).join('');
  const pred = E.prediccion ? (E.prediccion.eleccion===PREDICCION.ok ? '✔ acertó' : '✘ eligió: '+nombres(PREDICCION.opciones[E.prediccion.eleccion])) : 'sin hacer';
  const rep = E.repaso ? (E.repaso.acerto ? '✔ recordó dónde estaba la llave' : '✘ no lo recordó; se le mostró') : 'sin hacer';
  const ord = E.orden ? (E.orden.terminado ? '✔ terminado con ' + E.orden.errores + ' toques equivocados' : 'empezado, sin terminar (' + E.orden.errores + ' toques equivocados)') : 'sin hacer';
  const exp = E.explico ? (E.explico.sola ? '✔ lo explicó sola' : 'lo explicaron juntos') : 'sin hacer';
  const toques = Object.entries(E.toques||{}).sort((a,b)=>b[1]-a[1]);
  $('#resumenPapa').innerHTML =
    '<p>Episodio '+EPISODIO+' · empezado: '+(E.inicio||'—')+' · terminado: '+(E.terminado||'no todavía')+' · veces que lo empezó: '+(E.sesiones||0)+'</p>'+
    '<p>Repaso del episodio 1: '+rep+'</p>'+
    '<p>Predicción: '+pred+'</p>'+
    '<table><tr><th>Pregunta</th><th>Resultado</th><th>Intentos</th></tr>'+filas+'</table>'+
    '<p><b>Fondos dibujados</b> (playa y parque): '+(E.dibujoFondos||'todavía no')+'</p>'+
    '<p><b>Ordenar los lugares</b>: '+ord+'</p>'+
    '<p><b>Explicar con sus dibujos</b>: '+exp+'</p>'+
    '<p><b>Palabras que tocó para escucharlas</b> (las que le cuestan):<br>'+
    (toques.length ? toques.map(([w,n])=>w+' ('+n+')').join(', ') : 'ninguna todavía')+'</p>';
  mostrar('papa');
});
$('#volverPapa').addEventListener('click', irPortada);
$('#borrarPapa').addEventListener('click', ()=>{ E = nuevo(); guardar(); irPortada(); });

$('#ver').textContent = 'VERSIÓN ' + VERSION;
irPortada();
</script>
</body>
</html>
