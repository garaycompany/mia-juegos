<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>El escáner de Mia — Ver sin contar</title>
<style>
  :root{
    --ink:#0A1030;
    --deep:#0d1642;
    --hud:#5BE7C4;
    --hud2:#2BB89A;
    --grupoA:#5BE7C4;
    --grupoB:#FFC24B;
    --lila:#7B5BD6;
    --lila2:#5B3FB0;
    --hueso:#F3F1FF;
    --rojo:#FF6B6B;
    --sombra:0 6px 0 rgba(0,0,0,.28);
    --stagebg1:#101a4d;
    --stagebg2:#2a1a5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
  body{
    background:var(--ink);
    color:var(--hueso);
    font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;
    user-select:none;
  }
  #app{width:100%;max-width:540px;min-height:100%;display:flex;flex-direction:column;position:relative}

  /* ---------- tipografía ---------- */
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:.5px}
  .eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--hud);font-weight:700;opacity:.85}

  /* ---------- botones ---------- */
  .btn{
    border:0;border-radius:16px;padding:14px 22px;font-size:17px;font-weight:800;
    font-family:inherit;color:#08122e;background:var(--hud);box-shadow:var(--sombra);
    cursor:pointer;transition:transform .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
  .btn.sec{background:var(--lila);color:#fff}
  .btn.ghost{background:transparent;color:var(--hueso);box-shadow:none;border:2px solid rgba(255,255,255,.25)}

  /* ---------- MENÚ ---------- */
  .pantalla{display:none;flex-direction:column;flex:1;padding:16px 16px 24px}
  .pantalla.on{display:flex}
  .logo{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
  .logo svg{width:64px;height:auto;flex:0 0 auto}
  .logo h1{font-size:25px;line-height:1.05}
  .logo p{margin:4px 0 0;font-size:12.5px;color:#B9C4FF;font-weight:600}

  .bloque{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:14px;margin-bottom:14px}
  .bloque h3{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--hud);margin-bottom:10px}

  .compas{display:flex;gap:8px}
  .compa{flex:1;background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:16px;padding:8px 4px 6px;text-align:center;cursor:pointer;transition:.15s}
  .compa svg{width:100%;height:56px}
  .compa span{display:block;font-size:11.5px;font-weight:800;margin-top:2px;color:#C9D2FF}
  .compa.sel{border-color:var(--hud);background:rgba(91,231,196,.14)}
  .compa.sel span{color:var(--hud)}

  .niveles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .nivel{
    position:relative;border-radius:18px;padding:10px 10px 9px;text-align:left;cursor:pointer;
    background:linear-gradient(160deg,var(--c1),var(--c2));border:1px solid rgba(255,255,255,.14);
    color:#fff;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.3);
  }
  .nivel .num{font-size:11px;font-weight:800;letter-spacing:1.5px;opacity:.75}
  .nivel .nom{font-size:14.5px;font-weight:800;line-height:1.15;margin:2px 0 4px}
  .nivel .meta{font-size:10.5px;opacity:.85;font-weight:700}
  .nivel .mini{position:absolute;right:6px;bottom:4px;width:40px;height:48px;opacity:.9}
  .nivel .mini svg{width:100%;height:100%;display:block}
  .nivel .est{font-size:12px;letter-spacing:2px;margin-top:3px}
  .nivel.lock{filter:grayscale(.85) brightness(.5);cursor:not-allowed}
  .nivel.lock::after{content:"🔒";position:absolute;right:10px;top:8px;font-size:16px}

  /* ---------- JUEGO ---------- */
  #juego{padding:0}
  .hud{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
  .hud .volver{background:none;border:0;color:#9FB0FF;font-size:22px;padding:2px 6px;cursor:pointer;font-family:inherit}
  .hud .tit{flex:1;min-width:0}
  .hud .tit b{display:block;font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud .tit small{font-size:10.5px;color:#8FA0E8;letter-spacing:1px;font-weight:700}
  .son{background:none;border:0;font-size:19px;cursor:pointer;color:#9FB0FF;padding:2px 4px}

  .puntos{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap}
  .pt{width:100%;max-width:20px;height:7px;border-radius:4px;background:rgba(255,255,255,.13);flex:1}
  .pt.ok{background:var(--hud)}
  .pt.no{background:var(--rojo)}
  .pt.now{background:#fff;animation:lat .9s infinite}
  @keyframes lat{50%{opacity:.35}}

  /* visor */
  .visorwrap{position:relative;margin:0 12px;border-radius:24px;padding:9px;
    background:linear-gradient(180deg,rgba(123,91,214,.55),rgba(43,184,154,.35));
    box-shadow:0 0 0 2px rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.5);}
  .visor{position:relative;width:100%;padding-top:82%;border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,var(--stagebg1),var(--stagebg2));}
  .capa{position:absolute;inset:0}
  #escena{z-index:1}
  #objetos{z-index:3}
  #mascara{z-index:4;pointer-events:none;opacity:0}
  #mascara.on{opacity:1}
  #marcas{z-index:5;pointer-events:none}
  .frag{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));opacity:.85}
  .frag svg{width:100%;height:100%;display:block}
  .obj.dist{filter:none}
  .obj.fuera{opacity:0 !important;transform:translate(-50%,-50%) scale(.6)}
  .velo{z-index:2;background:rgba(7,11,38,.46);pointer-events:none}
  .rejilla{z-index:2;pointer-events:none;opacity:.16;
    background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:14.28% 16.6%}
  .esquina{position:absolute;width:26px;height:26px;border:3px solid var(--hud);z-index:6;opacity:.75;border-radius:3px}
  .e1{top:8px;left:8px;border-right:0;border-bottom:0}
  .e2{top:8px;right:8px;border-left:0;border-bottom:0}
  .e3{bottom:8px;left:8px;border-right:0;border-top:0}
  .e4{bottom:8px;right:8px;border-left:0;border-top:0}
  .barrido{position:absolute;left:0;right:0;height:34%;z-index:5;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,transparent,rgba(91,231,196,.35),transparent)}
  .barrido.go{animation:barre .55s linear}
  @keyframes barre{0%{opacity:1;top:-34%}100%{opacity:1;top:100%}}

  .obj{position:absolute;transform:translate(-50%,-50%) scale(1);opacity:0;
    transition:left .55s cubic-bezier(.5,0,.2,1),top .55s cubic-bezier(.5,0,.2,1),opacity .18s linear,transform .25s}
  .obj.ya{opacity:1}
  .obj.instant{transition:none}
  .obj svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  .obj.gA{filter:drop-shadow(0 0 7px var(--grupoA))}
  .obj.gB{filter:drop-shadow(0 0 7px var(--grupoB))}
  .obj.pop{transform:translate(-50%,-50%) scale(1.22)}

  .halo{position:absolute;border-radius:999px;border:3px dashed var(--grupoA);opacity:0;
    transition:opacity .3s;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
  .halo.B{border-color:var(--grupoB)}
  .halo.on{opacity:.9}
  .chapa{position:absolute;transform:translate(-50%,-50%) scale(.5);opacity:0;transition:.3s;z-index:7;
    background:var(--grupoA);color:#06231d;font-weight:900;font-size:19px;border-radius:12px;padding:2px 10px;
    box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .chapa.B{background:var(--grupoB);color:#3a2500}
  .chapa.tot{background:#fff;color:#16205a;font-size:24px}
  .chapa.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

  .aviso{position:absolute;inset:auto 0 0;z-index:8;text-align:center;padding:0 14px 10px;pointer-events:none}
  .aviso b{display:inline-block;background:rgba(6,12,40,.82);border:1px solid rgba(255,255,255,.18);
    border-radius:14px;padding:7px 14px;font-size:15px;line-height:1.25;max-width:100%}
  .cuenta{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;
    font-size:70px;font-weight:900;color:var(--hud);opacity:0;text-shadow:0 0 24px rgba(91,231,196,.6)}
  .cuenta.on{animation:cu .48s ease-out}
  @keyframes cu{0%{opacity:0;transform:scale(1.7)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85)}}

  /* fila personajes */
  .fila{display:flex;align-items:flex-end;gap:8px;padding:8px 14px 4px;min-height:104px}
  .pers{width:66px;flex:0 0 auto}
  .pers svg{width:100%;height:auto;display:block}
  .pers.salta{animation:sal .5s}
  @keyframes sal{0%,100%{transform:translateY(0)}40%{transform:translateY(-11px)}}
  .globo{flex:1;background:var(--hueso);color:#161b45;border-radius:16px;padding:9px 12px;font-size:14.5px;
    font-weight:700;line-height:1.3;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25);min-height:44px;
    display:flex;align-items:center}
  .globo:after{content:"";position:absolute;left:-9px;bottom:14px;border:7px solid transparent;border-right-color:var(--hueso)}
  .globo em{font-style:normal;color:var(--lila2);font-weight:900}

  /* teclado */
  .teclas{display:grid;gap:7px;padding:6px 12px 14px}
  .teclas.c5{grid-template-columns:repeat(5,1fr)}
  .teclas.c10{grid-template-columns:repeat(5,1fr)}
  .teclas.c12{grid-template-columns:repeat(6,1fr)}
  .teclas.c12 .tec{font-size:20px;padding:11px 0}
  .tec{border:0;border-radius:15px;background:linear-gradient(180deg,#fff,#DFE3FF);color:#141a48;
    font-family:inherit;font-size:23px;font-weight:900;padding:13px 0;box-shadow:0 5px 0 #9AA3D8;cursor:pointer}
  .tec:active{transform:translateY(3px);box-shadow:0 2px 0 #9AA3D8}
  .tec.off{opacity:.32;pointer-events:none;box-shadow:0 5px 0 #6d74a0}
  .tec.bien{background:linear-gradient(180deg,#8DFFE0,#3ED6B2);box-shadow:0 5px 0 #1E8E76;animation:pum .35s}
  .tec.mal{background:linear-gradient(180deg,#FFB0B0,#F07676);box-shadow:0 5px 0 #A64141}
  @keyframes pum{50%{transform:scale(1.14)}}
  .teclas.oculto{visibility:hidden}
  .accion{padding:6px 12px 16px;display:flex;gap:8px}
  .accion .btn{flex:1}

  /* fin de nivel */
  .fin{text-align:center;padding:18px 8px}
  .fin .estrellas{font-size:44px;letter-spacing:6px;margin:6px 0 2px}
  .fin h2{font-size:24px;margin-bottom:6px}
  .fin .dato{font-size:14px;color:#B9C4FF;font-weight:700;margin-bottom:12px;line-height:1.45}
  .fin .dato b{color:var(--hud)}
  .tarjeta{background:rgba(255,255,255,.06);border-radius:18px;padding:12px 14px;text-align:left;font-size:13.5px;
    line-height:1.5;color:#D7DDFF;margin:0 4px 14px;border:1px solid rgba(255,255,255,.09)}
  .tarjeta b{color:var(--hud)}
  .pie{font-size:11px;color:#6B78BE;text-align:center;padding:4px 20px 10px;line-height:1.5}
  .version{display:inline-block;margin-top:6px;font-size:10px;letter-spacing:1.5px;
    color:#4E5A96;border:1px solid rgba(120,135,210,.3);border-radius:8px;padding:2px 8px}
  /* ====== HORIZONTAL (Echo Show, tablets acostadas) ====== */
  @media (orientation:landscape){
    #app{max-width:1100px}
    .niveles{grid-template-columns:repeat(4,1fr)}
    /* Juego: el visor a la izquierda; Mia, el globo y el teclado a la derecha */
    #juego.on{display:grid;grid-template-columns:auto minmax(0,1fr);align-content:start;
      grid-template-areas:"hud hud" "pts pts" "vis fila" "vis teclas" "vis accion" "vis .";
      grid-template-rows:auto auto auto auto auto 1fr;height:100vh;height:100dvh;overflow:hidden}
    #juego .hud{grid-area:hud}
    #juego .puntos{grid-area:pts}
    #juego .visorwrap{grid-area:vis;align-self:start;width:calc((100vh - 96px) / .82 + 18px);width:calc((100dvh - 96px) / .82 + 18px);max-width:58vw}
    #juego .fila{grid-area:fila}
    #juego .teclas{grid-area:teclas}
    #juego .accion{grid-area:accion}
    .fin{width:100%;max-width:680px;margin:0 auto}
  }
  /* Pantallas bajas: Echo Show 5 (960 x 480) */
  @media (orientation:landscape) and (max-height:620px){
    .hud{padding:6px 12px 4px}
    .puntos{padding-bottom:6px}
    .fila{min-height:84px;padding:4px 12px 2px}
    .pers{width:54px}
    .globo{font-size:14px;padding:7px 10px}
    .tec{padding:10px 0;font-size:21px}
    .teclas{gap:6px;padding:4px 12px 10px}
    .fin{padding:8px}
    .fin .estrellas{font-size:34px;margin:2px 0}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.06s !important}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ MENÚ ============ -->
  <section id="menu" class="pantalla on">
    <div class="logo">
      <svg viewBox="0 0 100 120" aria-hidden="true"><g id="logomia"></g></svg>
      <div>
        <div class="eyebrow">Tema 1 · Sentido numérico</div>
        <h1>El escáner de Mia</h1>
        <p>Ver cuántos son sin contar uno por uno</p>
      </div>
    </div>

    <div class="bloque">
      <h3>¿Con quién escaneas?</h3>
      <div class="compas" id="compas"></div>
    </div>

    <div class="bloque">
      <h3>Misiones</h3>
      <div class="niveles" id="niveles"></div>
    </div>

    <p class="pie">Cada misión se aprueba con 8 aciertos de 10 al primer intento.<br>Si algo falla, el visor te enseña la forma y vuelves a intentarlo.<br>
      <span id="ver" class="version"></span></p>
  </section>

  <!-- ============ JUEGO ============ -->
  <section id="juego" class="pantalla">
    <div class="hud">
      <button class="volver" id="volver" aria-label="Volver">‹</button>
      <div class="tit"><b id="tnom">Nivel</b><small id="tsub">—</small></div>
      <button class="son" id="son" aria-label="Sonido">🔊</button>
    </div>
    <div class="puntos" id="puntos"></div>

    <div class="visorwrap">
      <div class="visor" id="visor">
        <div class="capa" id="escena"></div>
        <div class="capa velo"></div>
        <div class="capa rejilla"></div>
        <div class="capa" id="objetos"></div>
        <div class="capa" id="mascara"></div>
        <div class="capa" id="marcas"></div>
        <div class="barrido" id="barrido"></div>
        <div class="esquina e1"></div><div class="esquina e2"></div>
        <div class="esquina e3"></div><div class="esquina e4"></div>
        <div class="cuenta" id="cuenta"></div>
        <div class="aviso" id="aviso"></div>
      </div>
    </div>

    <div class="fila">
      <div class="pers" id="pmia"></div>
      <div class="globo" id="globo">…</div>
      <div class="pers" id="pcompa"></div>
    </div>

    <div class="teclas c5" id="teclas"></div>
    <div class="accion" id="accion"></div>
  </section>

  <!-- ============ FIN ============ -->
  <section id="fin" class="pantalla">
    <div class="fin">
      <div class="eyebrow" id="fineyebrow">Misión terminada</div>
      <div class="estrellas" id="finest">★★★</div>
      <h2 id="fintit">¡Escaneo completo!</h2>
      <div class="dato" id="findato"></div>
      <div class="tarjeta" id="fintarjeta"></div>
      <div class="accion">
        <button class="btn ghost" id="finmenu">Misiones</button>
        <button class="btn" id="finsig">Siguiente</button>
      </div>
    </div>
  </section>

</div>

<script>
/* =====================================================================
   EL ESCÁNER DE MIA — subitización (Tema 1: sentido numérico)
   Diseño pedagógico:
   · Instrucción Directa: modelo ("yo lo hago") → guiada ("lo hacemos")
     → evaluada ("tú lo haces"). Nunca se evalúa un patrón sin modelarlo.
   · El error no castiga ni reinicia: re-enseña la FORMA (agrupación),
     repite el ítem sin tiempo, y lo reprograma más adelante (repaso espaciado).
   · Anti-adivinanza: una sola respuesta por ítem, el teclado se bloquea al
     tocar, y sólo cuenta el primer intento cronometrado.
   · Encuadre de estrategia, nunca de brillantez (Bian, Leslie & Cimpian 2017).
   ===================================================================== */

/* Versión del juego. Se sube a mano en cada actualización real del contenido;
   el candado de entrega la usa para nombrar el archivo y se niega a entregar
   contenido nuevo con una versión ya usada. */
const VERSION='5.2';

/* ---------------------- SONIDO ---------------------- */
const Audio_ = {
  ctx:null, on:true,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
          if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,dur,type,vol,delay){
    if(!this.on||!this.ctx) return;
    const t0=this.ctx.currentTime+(delay||0);
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol||.18,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+dur+.03);
  },
  sweep(){
    if(!this.on||!this.ctx) return;
    const t0=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(220,t0);
    o.frequency.exponentialRampToValueAtTime(1400,t0+.4);
    g.gain.setValueAtTime(.001,t0); g.gain.linearRampToValueAtTime(.07,t0+.05);
    g.gain.exponentialRampToValueAtTime(.0001,t0+.45);
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
    o.connect(f); f.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+.5);
  },
  tic(){ this.tone(880,.07,'square',.09); },
  bien(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.28,'triangle',.16,i*.075)); },
  suave(){ this.tone(392,.22,'sine',.13); this.tone(330,.3,'sine',.11,.13); },
  chapa(i){ this.tone(600+i*160,.18,'triangle',.14); },
  fanfarria(){ [523,659,784,1046,1318].forEach((f,i)=>this.tone(f,.4,'triangle',.15,i*.11)); },
  /* ================= VOZ =================
     Regla: NADA se acorta y NADA se descarta. Una frase a la vez, en cola.
     El juego consulta libre() y espera a que termine de hablar antes de
     seguir, en vez de cortarla. Si el navegador no tiene síntesis o está
     en silencio, libre() es siempre cierto y el juego corre a su ritmo base. */
  cola:[], hablando:false, vigia:null, corte:null,
  dichas:0, cortadas:0, descartes:0,
  disponible(){ return this.on && ('speechSynthesis' in window); },
  libre(){ return !this.disponible() || (!this.hablando && this.cola.length===0); },
  hablar(txt,modo){
    if(!this.disponible() || !txt) return;
    txt=String(txt).replace(/<[^>]+>/g,'')
                   .replace(/^\s*(Mia|Buzz|Jessie|Woody|Rex)\s*:\s*/i,'')  /* la etiqueta de quién habla no se lee */
                   .replace(/\s+/g,' ').trim();
    if(!txt) return;
    if(modo==='ya'){ this.callar(); }          /* solo en cambios de pantalla */
    this.cola.push(txt);
    if(!this.hablando) this.siguiente();
  },
  siguiente(){
    if(!this.disponible() || !this.cola.length){ this.hablando=false; return; }
    const txt=this.cola.shift();
    this.hablando=true; this.dichas++;
    let u;
    try{ u=new SpeechSynthesisUtterance(txt); }catch(e){ this.hablando=false; return; }
    u.lang='es-ES'; u.rate=.95; u.pitch=1.12; u.volume=1;
    try{
      const vs=speechSynthesis.getVoices()||[];
      const v=vs.find(x=>/^es/i.test(x.lang||''));
      if(v) u.voice=v;
    }catch(e){}
    let cerrado=false;
    const fin=()=>{ if(cerrado) return; cerrado=true; clearTimeout(this.corte);
                    this.hablando=false; this.siguiente(); };
    u.onend=fin; u.onerror=fin;
    /* red de seguridad: si el motor se cuelga, la cola no se queda trabada */
    this.corte=setTimeout(fin, 1200+txt.length*110);
    try{ speechSynthesis.speak(u); }catch(e){ fin(); }
    if(!this.vigia){
      /* Chrome pausa la síntesis solo tras ~15 s; esto la despierta */

    }
  },

    if(this.hablando) this.cortadas++;
    this.descartes+=this.cola.length;
    this.cola.length=0;
    try{ speechSynthesis.cancel(); }catch(e){}
    clearTimeout(this.corte); this.hablando=false;
  }
};

/* ---------------------- PATRONES ---------------------- */
const DADO={
 1:[[.5,.5]],
 2:[[.32,.30],[.68,.70]],
 3:[[.28,.26],[.5,.5],[.72,.74]],
 4:[[.32,.30],[.68,.30],[.32,.70],[.68,.70]],
 5:[[.30,.28],[.70,.28],[.5,.5],[.30,.72],[.70,.72]],
 6:[[.30,.24],[.30,.5],[.30,.76],[.70,.24],[.70,.5],[.70,.76]]
};
const DADO_G={1:[[0]],2:[[0,1]],3:[[0,1,2]],4:[[0,2],[1,3]],5:[[0,1,3,4],[2]],6:[[0,1,2],[3,4,5]]};

function fila(cant,y,ancho){
  const pts=[]; if(cant<=0) return pts;
  const w=ancho||.62, x0=.5-w/2;
  for(let i=0;i<cant;i++) pts.push([cant===1?.5:x0+w*(i/(cant-1)),y]);
  return pts;
}
function filaIzq(cant,y,paso,x0){
  const pts=[]; for(let i=0;i<cant;i++) pts.push([x0+paso*i,y]); return pts;
}

function patron(kind,n){
  if(kind==='dado' && DADO[n]) return {pts:DADO[n].map(p=>p.slice()),grupos:DADO_G[n].map(g=>g.slice())};
  if(kind==='domino'){
    const a=Math.ceil(n/2), b=n-a;
    const paso=.13, x0a=.5-paso*(a-1)/2, x0b=.5-paso*(b-1)/2;
    const p1=filaIzq(a,.33,paso,x0a), p2=filaIzq(b,.68,paso,x0b);
    const g=[p1.map((_,i)=>i)]; if(b>0) g.push(p2.map((_,i)=>i+a));
    return {pts:p1.concat(p2),grupos:g};
  }
  if(kind==='cinco'){
    const a=Math.min(5,n), b=n-a, paso=.14, x0=.5-paso*4/2;
    const p1=filaIzq(a,.34,paso,x0), p2=filaIzq(b,.70,paso,x0);
    const g=[p1.map((_,i)=>i)]; if(b>0) g.push(p2.map((_,i)=>i+a));
    return {pts:p1.concat(p2),grupos:g};
  }
  if(kind==='dobles'){
    const m=n/2, base=DADO[m]||DADO[Math.min(6,m)];
    const izq=base.map(p=>[.10+p[0]*.36,.20+p[1]*.60]);
    const der=base.map(p=>[.54+p[0]*.36,.20+p[1]*.60]);
    return {pts:izq.concat(der),grupos:[izq.map((_,i)=>i),der.map((_,i)=>i+m)]};
  }
  if(kind==='diez'){
    /* filas de cinco: puente hacia el marco de diez */
    const paso=.15, x0=.5-paso*4/2;
    const f1=filaIzq(5,.26,paso,x0), f2=filaIzq(5,.53,paso,x0), f3=filaIzq(n-10,.80,paso,x0);
    const g=[f1.concat(f2).map((_,i)=>i)];
    if(n>10) g.push(f3.map((_,i)=>i+10));
    return {pts:f1.concat(f2,f3),grupos:g};
  }
  if(kind==='suma'){ const a=Math.ceil(n/2); return patronSuma(a,n-a); }
  /* disperso: posiciones al azar con separación mínima.
     Si no caben, se relaja la separación por pasos en vez de amontonar. */
  let min=n<=4?.26:(n<=7?.21:.175);
  for(let ronda=0;ronda<12;ronda++){
    const pts=[];
    let guarda=0;
    while(pts.length<n && guarda<3000){
      guarda++;
      const x=.14+Math.random()*.72, y=.16+Math.random()*.68;
      if(pts.every(p=>Math.hypot(p[0]-x,(p[1]-y)*.82)>min)) pts.push([x,y]);
    }
    if(pts.length===n) return {pts,grupos:[pts.map((_,i)=>i)],disperso:true};
    min*=.92;
    if(min<.115) min=.115;
  }
  /* último recurso: rejilla irregular, nunca objetos superpuestos */
  const cols=Math.ceil(Math.sqrt(n*1.3)), filas=Math.ceil(n/cols), rej=[];
  for(let i=0;i<n;i++){
    const cx=i%cols, cy=Math.floor(i/cols);
    rej.push([.13+(cx+.5+(Math.random()-.5)*.35)*(.74/cols),
              .15+(cy+.5+(Math.random()-.5)*.35)*(.70/filas)]);
  }
  return {pts:rej,grupos:[rej.map((_,i)=>i)],disperso:true};
}

/* dos cúmulos separados: para la composición (5 y 3 son 8) */
function patronSuma(a,b){
  const ba=DADO[Math.min(6,a)]||DADO[6], bb=DADO[Math.min(6,b)]||DADO[6];
  const izq=ba.slice(0,a).map(p=>[.09+p[0]*.34,.22+p[1]*.56]);
  const der=bb.slice(0,b).map(p=>[.57+p[0]*.34,.22+p[1]*.56]);
  return {pts:izq.concat(der),grupos:[izq.map((_,i)=>i),der.map((_,i)=>i+a)]};
}

/* forma canónica que se usa para ENSEÑAR una cantidad */
function patronEnsena(n){
  if(n<=6) return 'dado';
  if(n<=10) return 'cinco';
  return 'diez';
}
const PALABRA=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce'];

  huevo:['huevo','huevos'],piedra:['piedra','piedras'],luna:['luna','lunas'],

function fraseGrupos(grupos,n){
  if(grupos.length<2) return `Esta forma es de ${PALABRA[n]}.`;
  const a=grupos[0].length,b=grupos[1].length;
  return `${cap(PALABRA[a])} y ${PALABRA[b]} son ${PALABRA[n]}.`;
}

/* ---------------------- CONSTRUCCIÓN DE NIVEL ---------------------- */
function compatible(kind,n){
  if(kind==='dado')   return n<=6;
  if(kind==='dobles') return n%2===0 && n>=4 && n<=12;
  if(kind==='cinco')  return n>=5 && n<=10;
  if(kind==='diez')   return n>=10 && n<=12;
  if(kind==='domino') return n>=2 && n<=10;
  return true;
}
function nuevoItem(L,evita){
  const tipo=L.obj[Math.floor(Math.random()*L.obj.length)];
  if(L.doble){
    /* composición: dos destellos que se suman */
    let a,b,n,intentos=0;
    do{
      a=2+Math.floor(Math.random()*5);            /* 2..6 */
      b=2+Math.floor(Math.random()*5);
      n=a+b; intentos++;
    }while((n>12 || n===evita) && intentos<40);
    if(n>12){ a=5; b=5; n=10; }
    return {n,n1:a,n2:b,kind:'suma',tipo,doble:true};
  }
  let n,intentos=0;
  do{ n=L.ns[Math.floor(Math.random()*L.ns.length)]; intentos++; }while(n===evita && intentos<12 && L.ns.length>1);
  const posibles=L.pat.filter(k=>compatible(k,n));
  const kind=posibles.length?posibles[Math.floor(Math.random()*posibles.length)]:'disperso';
  const it={n,kind,tipo};
  if(L.distrac){
    it.dist=L.distrac[Math.floor(Math.random()*L.distrac.length)];
    const rd=L.nd||[2,5];
    it.nd=rd[0]+Math.floor(Math.random()*(rd[1]-rd[0]+1));
    it.kind='disperso';
  }
  return it;
}
function empieza(idx){
  limpiaTimers(); Audio_.callar();
  S.nivel=idx; const L=NIVELES[idx];
  S.cola=[]; let prev=-1;
  for(let i=0;i<10;i++){ const it=nuevoItem(L,prev); prev=it.n; S.cola.push(it); }
  S.i=0; S.aciertos=0; S.primeros=0; S.extras=0; S.resultados=[]; S.ms=L.startMs; S.msUsados=[]; S.modelo=0;
  $('#tnom').textContent=L.nom;
  $('#tsub').textContent='MISIÓN '+String(L.id).padStart(2,'0')+' · '+L.per.map(p=>NOMBRES[p]).join(' y ');
  $('#escena').innerHTML=escena(L.esc);
  $('#pmia').innerHTML=P.mia(true);
  $('#pcompa').innerHTML=P[S.compa]();
  pintaPuntos();
  ir('juego');
  faseModelo();
}
function pintaPuntos(){

  }
}

/* ---------------------- RENDER DE OBJETOS ---------------------- */
function tamObjeto(n){
  const w=visor.clientWidth||320;
  let f = n<=3?.19 : n<=6?.155 : .125;
  return Math.max(24,Math.round(w*f));
}
/* Dibuja los objetos. Si el ítem tiene distractores, se añaden después
   con la clase .dist: cuentan como estorbo visual, nunca como respuesta. */
function dibuja(item,pts,instant,ptsDist){
  objetos.innerHTML=''; marcas.innerHTML='';
  const s=tamObjeto(item.n+(item.nd||0));
  const svg=OBJ[item.tipo]||OBJ.estrella;
  const nodo=(p,clase,markup,tam)=>{
    const d=document.createElement('div');
    d.className='obj'+(instant?' instant':'')+(clase?' '+clase:'');
    d.style.width=tam+'px'; d.style.height=tam+'px';
    d.style.left=(p[0]*100)+'%'; d.style.top=(p[1]*100)+'%';
    d.innerHTML=markup;
    objetos.appendChild(d);
  };
  pts.forEach(p=>nodo(p,'',svg,s));
  if(ptsDist && item.dist){
    const sd=OBJ[item.dist]||OBJ.estrella;
    ptsDist.forEach(p=>nodo(p,'dist',sd,Math.round(s*.92)));
  }
  return Array.from(objetos.children);
}

/* Reparte objetivos y distractores en el mismo espacio, sin solaparse. */
function disposicionMixta(n,nd){
  const total=patron('disperso',n+nd).pts;
  const mezcla=total.slice();
  for(let i=mezcla.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [mezcla[i],mezcla[j]]=[mezcla[j],mezcla[i]]; }
  return {pts:mezcla.slice(0,n),dist:mezcla.slice(n)};
}
function mostrar(on){ Array.from(objetos.children).forEach(e=>e.classList.toggle('ya',on)); }
function limpiaVisor(){ objetos.innerHTML=''; marcas.innerHTML=''; aviso.innerHTML='';
  mascaraCapa.innerHTML=''; mascaraCapa.classList.remove('on'); }

/* Máscara de retrodetección: ruido visual justo después del destello.
   Borra la imagen persistente de la retina, así que ya no se puede
   "contar el recuerdo": obliga al reconocimiento en el momento. */
function lanzaMascara(item,ms){
  const s=Math.round(tamObjeto(item.n)*.6);
  const piezas=Object.values(OBJ);
  let html='';
  for(let i=0;i<26;i++){
    const x=6+Math.random()*88, y=8+Math.random()*84, r=Math.floor(Math.random()*360);
    const svg=piezas[Math.floor(Math.random()*piezas.length)];
    html+=`<div class="frag" style="--r:${r}deg;left:${x}%;top:${y}%;width:${s}px;height:${s}px">${svg}</div>`;
  }
  mascaraCapa.innerHTML=html;
  mascaraCapa.classList.add('on');
  luego(()=>{ mascaraCapa.classList.remove('on'); mascaraCapa.innerHTML=''; }, ms||170);
}

/* di(texto)      → lo escribe en el globo y lo dice completo, esperando su turno
   di(texto,'ya') → además corta lo anterior (solo al cambiar de misión)
   El texto del globo y el hablado son el mismo: nunca se recorta el diálogo. */
function di(txt,modo){
  globo.innerHTML=txt;
  Audio_.hablar(txt,modo);
}

/* Espera a que la voz termine antes de continuar. Así el juego se adapta al
   diálogo y no al revés. minMs es el ritmo mínimo; tope evita quedarse colgado. */
function esperaVoz(cb,minMs,tope){
  const max=tope||12000, paso=110;
  let t=0;                       /* cuenta sus propios ticks: si la pestaña se
                                    va a segundo plano, el juego espera, no salta */
  const revisa=()=>{
    if((Audio_.libre() && t>=(minMs||0)) || t>=max) return cb();
    t+=paso; luego(revisa,paso);
  };
  const ini=Math.max(80, Math.min(minMs||0, 300));
  t=ini; luego(revisa,ini);
}

function avisa(txt){ aviso.innerHTML=txt?('<b>'+txt+'</b>'):''; }
function saltaCompa(){ const e=$('#pcompa'); e.classList.remove('salta'); void e.offsetWidth; e.classList.add('salta'); }
function saltaMia(){ const e=$('#pmia'); e.classList.remove('salta'); void e.offsetWidth; e.classList.add('salta'); }

/* ---------------------- ENSEÑANZA: mostrar la agrupación ---------------------- */
/* Mueve los objetos a la forma canónica, los agrupa por color, pone
   la chapa de cada grupo y luego el total. NO se cuenta de uno en uno:
   se nombra la forma. */
function ensenaForma(n,cb,prefacio,rapido,suma){
  /* suma = [a,b] fuerza la agrupación de la composición (5 y 3 son 8) */
  const pat = suma ? patronSuma(suma[0],suma[1]) : patron(patronEnsena(n),n);
  /* los distractores se apagan primero: solo queda lo que se contaba */
  Array.from(objetos.querySelectorAll('.obj.dist')).forEach(e=>{
    e.classList.remove('instant'); e.classList.add('fuera');
    luego(()=>{ if(e.parentNode) e.parentNode.removeChild(e); },320);
  });
  const utiles=Array.from(objetos.children).filter(e=>!e.classList.contains('dist'));
  if(utiles.length!==n){
    dibuja({n,tipo:S.item?S.item.tipo:'estrella'},pat.pts,true);
  }
  const nodos=Array.from(objetos.children).filter(e=>!e.classList.contains('dist'));
  nodos.forEach(e=>{ e.classList.remove('instant'); e.classList.add('ya'); });
  const W=visor.clientWidth||320, H=visor.clientHeight||260, s=tamObjeto(n);
  /* doble rAF: garantiza que la quita de .instant se aplique antes de mover */
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    nodos.forEach((e,i)=>{
      const p=pat.pts[i]; if(!p) return;
      e.style.left=(p[0]*100)+'%'; e.style.top=(p[1]*100)+'%';
    });
  }));
  Audio_.sweep();
  avisa(prefacio||'Mira la forma');

  const espera = rapido?380:620;
  const pasoG  = rapido?220:520;

  luego(()=>{
    pat.grupos.forEach((g,gi)=>{
      g.forEach(idx=>{ const e=nodos[idx]; if(e) e.classList.add(gi===0?'gA':'gB'); });
      const xs=g.map(i=>pat.pts[i][0]), ys=g.map(i=>pat.pts[i][1]);
      const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
      const hw=(Math.max(...xs)-Math.min(...xs))*W+s*1.35;
      const hh=(Math.max(...ys)-Math.min(...ys))*H+s*1.35;
      const halo=document.createElement('div');
      halo.className='halo'+(gi?' B':'');
      halo.style.left=(cx*100)+'%'; halo.style.top=(cy*100)+'%';
      halo.style.width=hw+'px'; halo.style.height=hh+'px';
      marcas.appendChild(halo);
      /* la chapa del grupo va ARRIBA del halo, nunca encima de los objetos */
      const ch=document.createElement('div');
      ch.className='chapa'+(gi?' B':'');
      ch.textContent=g.length;
      const topPx=Math.max(20, cy*H - hh/2 - 16);
      ch.style.left=(cx*100)+'%'; ch.style.top=topPx+'px';
      marcas.appendChild(ch);
      luego(()=>{ halo.classList.add('on'); ch.classList.add('on'); Audio_.chapa(gi); }, 200+gi*pasoG);
    });
    const total=document.createElement('div');
    total.className='chapa tot'; total.textContent=n;
    total.style.left='50%'; total.style.top=(H-26)+'px';
    marcas.appendChild(total);
    luego(()=>{
      total.classList.add('on'); Audio_.bien();
      const f=fraseGrupos(pat.grupos,n);
      avisa('');                       /* el aviso libera el borde inferior */
      di('<em>'+f+'</em>');
      esperaVoz(()=>{ if(cb) cb(); }, rapido?700:1000);
    }, 240+pat.grupos.length*pasoG+180);
  },espera);
}

/* ---------------------- FASE 1: MODELO ("yo lo hago") ---------------------- */
function faseModelo(){
  S.fase='modelo'; limpiaVisor(); apagaTeclas();
  const L=NIVELES[S.nivel];
  pintaTeclas(L.pad,false,()=>{});
  teclas.classList.add('oculto');
  const ejemplos=modelosDe(L);
  const ej=ejemplos[S.modelo];
  di(`<em>${NOMBRES[S.compa]}:</em> ${S.modelo===0? 'Mira, te enseño primero. '+L.ense
                                                      : 'Muy bien. Ahora otra forma más.'}`);
  S.item=ej;
  if(ej.doble){
    const pat=patronSuma(ej.n1,ej.n2);
    dibuja(ej,pat.pts,true);
  }else if(ej.nd){
    const m=disposicionMixta(ej.n,ej.nd);
    dibuja(ej,m.pts,true,m.dist);
    avisa(`Cuenta solo ${NOMOBJ[ej.tipo][1]}`);
  }else{
    dibuja(ej,patron(ej.kind,ej.n).pts,true);
  }
  mostrar(true);
  botones([{t:'Ver la forma',f:()=>{
    botones([]);
    ensenaForma(ej.n,()=>{
      S.modelo++;
      if(S.modelo<ejemplos.length){ luego(faseModelo,250); }
      else { luego(faseGuiada,250); }
    },'Yo lo hago',false, ej.doble?[ej.n1,ej.n2]:null);
  }}]);
  pintaPuntos();
}
function modelosDe(L){
  /* El modelo debe tener la MISMA mecánica que la prueba: si el nivel lleva
     distractores o doble destello, los ejemplos también. */
  if(L.doble) return [{n:8,n1:5,n2:3,kind:'suma',tipo:L.obj[0],doble:true},
                      {n:9,n1:4,n2:5,kind:'suma',tipo:L.obj[0],doble:true}];
  const ns=L.ns.slice();
  const elegido=[ns[Math.floor(ns.length/2)], ns[ns.length-1]];
  return elegido.map(n=>{
    const posibles=L.pat.filter(k=>compatible(k,n)&&k!=='disperso');
    const kind=posibles.length?posibles[0]:patronEnsena(n);
    const ej={n,kind,tipo:L.obj[0]};
    if(L.distrac){ ej.dist=L.distrac[0]; ej.nd=3; ej.kind='disperso'; }
    return ej;
  });
}

/* ---------------------- FASE 2: GUIADA ("lo hacemos") ---------------------- */
function faseGuiada(){
  S.fase='guiada'; limpiaVisor(); botones([]);
  const L=NIVELES[S.nivel];
  const it=nuevoItem(L,-1);
  S.item=it;
  teclas.classList.remove('oculto');
  if(it.doble){ dibuja(it,patronSuma(it.n1,it.n2).pts,true); }
  else if(it.nd){ const m=disposicionMixta(it.n,it.nd); dibuja(it,m.pts,true,m.dist); }
  else { dibuja(it,patron(it.kind,it.n).pts,true); }
  mostrar(true);
  avisa(it.nd? `Sin apuro. Cuenta solo ${NOMOBJ[it.tipo][1]}` : 'Sin apuro: la imagen se queda');
  di(`<em>${NOMBRES[S.compa]}:</em> Ahora juntos. Mira la forma y toca cuántos son. Esta vez no desaparece.`);
  pintaTeclas(L.pad,true,(v,btn)=>{
    if(v===it.n){
      btn.classList.add('bien'); Audio_.bien(); saltaMia();
      di('<em>¡Eso es!</em> Viste la forma, no contaste de uno en uno.');
      avisa('');
      esperaVoz(()=>{ luego(faseJuego,200); },900);
    }else{
      btn.classList.add('mal'); Audio_.suave();
      di('Casi. Mira la agrupación conmigo.');
      luego(()=>ensenaForma(it.n,()=>{ luego(faseJuego,200); },'Lo hacemos juntos',false,
                            it.doble?[it.n1,it.n2]:null),700);
    }
  });
  botones([]);
}

/* ---------------------- FASE 3: EVALUADA ("tú lo haces") ---------------------- */
function faseJuego(){
  S.fase='juego'; limpiaVisor(); botones([]);
  teclas.classList.remove('oculto');
  const L=NIVELES[S.nivel];
  if(S.i>=S.cola.length){ return finNivel(); }
  const it=S.cola[S.i]; S.item=it;
  pintaPuntos();
  apagaTeclas(); pintaTeclas(L.pad,false,()=>{});
  di(it.repaso ? `<em>${NOMBRES[S.compa]}:</em> Otra vez esta forma. Ya la conoces.`
    : it.nd     ? `<em>${NOMBRES[S.compa]}:</em> Cuenta solo ${NOMOBJ[it.tipo][1]}. Ignora ${NOMOBJ[it.dist][1]}.`
    : it.doble  ? `<em>${NOMBRES[S.compa]}:</em> Dos destellos. Guarda el primero y súmale el segundo.`
                : `<em>${NOMBRES[S.compa]}:</em> ${LLAMADAS[S.i % LLAMADAS.length]}`);
  avisa('');
  let c=3;
  const tick=()=>{
    const e=$('#cuenta'); e.textContent=c; e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
    Audio_.tic(); c--;
    if(c>0) luego(tick,420); else luego(destello,420);
  };
  esperaVoz(tick,420);          /* la cuenta atrás no pisa el diálogo */

  function barrido(){ const b=$('#barrido'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); Audio_.sweep(); }
  function pregunta(){
    avisa(it.nd? `¿Cuántas ${NOMOBJ[it.tipo][1]} eran?` : (it.doble? '¿Cuántos en total?' : '¿Cuántos eran?'));
    pintaTeclas(L.pad,true,responde);
  }

  function destello(){
    if(it.doble) return destelloDoble();
    if(it.nd){
      const m=disposicionMixta(it.n,it.nd);
      it._pat={pts:m.pts,grupos:[m.pts.map((_,i)=>i)]}; it._dist=m.dist;
      dibuja(it,m.pts,true,m.dist);
    }else{
      it._pat=patron(it.kind,it.n);
      dibuja(it,it._pat.pts,true);
    }
    barrido();
    requestAnimationFrame(()=>{
      mostrar(true);
      luego(()=>{
        mostrar(false);
        if(L.mascara) lanzaMascara(it,170);
        luego(pregunta, L.mascara?190:0);
      },S.ms);
    });
  }

  /* Composición: dos destellos separados. Hay que retener el primero. */
  function destelloDoble(){
    const pat=patronSuma(it.n1,it.n2);
    it._pat=pat;
    const a=pat.pts.slice(0,it.n1), b=pat.pts.slice(it.n1);
    dibuja({n:it.n1,tipo:it.tipo},a,true);
    barrido();
    requestAnimationFrame(()=>{
      mostrar(true);
      luego(()=>{
        mostrar(false);
        luego(()=>{
          dibuja({n:it.n2,tipo:it.tipo},b,true);
          Audio_.tone(660,.12,'triangle',.12);
          requestAnimationFrame(()=>{
            mostrar(true);
            luego(()=>{ mostrar(false); pregunta(); },S.ms);
          });
        },340);
      },S.ms);
    });
  }

  function responde(v,btn){
    apagaTeclas(); avisa('');
    const ok = (v===it.n);
    if(!it.repaso){ it.ok=ok; S.primeros++; S.resultados.push(ok); if(ok){S.aciertos++; S.msUsados.push(S.ms);} }
    if(ok){
      btn.classList.add('bien'); Audio_.bien(); saltaMia(); saltaCompa();
      S.ms=Math.max(NIVELES[S.nivel].targetMs, S.ms-100);
      di('<em>'+elogio()+'</em>');
      rePinta();   /* refuerzo: se vuelve a ver la agrupación, corto */
      luego(()=>ensenaForma(it.n,()=>{ avanza(); },'Así se veía',true,
                            it.doble?[it.n1,it.n2]:null),450);
    }else{
      btn.classList.add('mal'); Audio_.suave();
      S.ms=Math.min(NIVELES[S.nivel].startMs, S.ms+250);
      di(`<em>${NOMBRES[S.compa]}:</em> Eran ${PALABRA[it.n]}. Te muestro la forma.`);
      rePinta();
      luego(()=>ensenaForma(it.n,()=>{ reintento(it); },'Esta forma es de '+PALABRA[it.n],false,
                            it.doble?[it.n1,it.n2]:null),450);
    }
  }

  /* vuelve a poner en pantalla exactamente lo que se destelló */
  function rePinta(){
    if(it.doble) dibuja(it,it._pat.pts,true);
    else dibuja(it,it._pat.pts,true,it._dist);
    mostrar(true);
  }

  /* reintento inmediato SIN tiempo (corrección de Instrucción Directa) */
  function reintento(it){
    limpiaVisor();
    const pat=it.doble? patronSuma(it.n1,it.n2) : patron(patronEnsena(it.n),it.n);
    dibuja(it,pat.pts,true); mostrar(true);
    avisa('Ahora tú: ¿cuántos son?');
    di('Ahora tú, sin apuro. Toca el número.');
    pintaTeclas(NIVELES[S.nivel].pad,true,(v,btn)=>{
      apagaTeclas();
      if(v===it.n){
        btn.classList.add('bien'); Audio_.bien(); saltaMia();
        di('<em>Ahí está.</em> Esa forma ya es tuya.');
      }else{
        btn.classList.add('mal'); Audio_.suave();
        const tec=Array.from(teclas.children).find(x=>+x.dataset.v===it.n);
        if(tec){ tec.classList.remove('off'); tec.classList.add('bien'); }
        di(`Era ${PALABRA[it.n]}. Se ilumina en el teclado. La repetimos más adelante.`);
      }
      avisa('');
      esperaVoz(()=>{ programaRepaso(it); avanza(); },1000);
    });
  }
  function programaRepaso(it){
    if(S.extras>=4) return;
    S.extras++;
    const copia={n:it.n,kind:it.kind,tipo:it.tipo,repaso:true};
    const pos=Math.min(S.cola.length, S.i+3);
    S.cola.splice(pos,0,copia);
  }
  function avanza(){
    limpiaVisor(); S.i++;
    luego(faseJuego,300);
  }
}
const LLAMADAS=['Prepara el visor.','Atención, ahí viene.','Mira bien.','Ojo al visor.',
                'Listo, allá va.','Concéntrate un segundo.','Otra vez, mira la forma.',
                'Vamos con la siguiente.','Prepárate.','Última mirada rápida.'];
function elogio(){
  const L=['¡Lo viste de golpe!','Esa agrupación te salió.','Tu visor va más rápido.',
           'Reconociste la forma.','Sin contar. Así se hace.','Buen escaneo.','Entrenaste ese patrón.'];
  return L[Math.floor(Math.random()*L.length)];
}

/* ---------------------- FIN DE NIVEL ---------------------- */
function finNivel(){
  limpiaTimers(); limpiaVisor(); apagaTeclas(); botones([]);
  const L=NIVELES[S.nivel];
  const a=S.aciertos;
  const paso = a>=8;
  const est = a>=10?3 : a>=9?2 : a>=8?1 : 0;
  if(est>(S.estrellas[L.id]||0)) S.estrellas[L.id]=est;
  if(paso) S.desbloq=Math.max(S.desbloq, Math.min(NIVELES.length, S.nivel+2));
  Guarda.escribir();
  const msProm = S.msUsados.length? Math.round(S.msUsados.reduce((x,y)=>x+y,0)/S.msUsados.length) : L.startMs;

  $('#fineyebrow').textContent = paso? 'Misión superada' : 'Vamos otra vez';
  $('#finest').textContent = est? '★'.repeat(est)+'☆'.repeat(3-est) : '☆☆☆';
  $('#fintit').textContent = paso? '¡Escaneo logrado!' : 'Casi lo tienes';
  $('#findato').innerHTML = `<b>${a} de 10</b> al primer intento<br>Velocidad media del visor: <b>${msProm} ms</b>`;
  $('#fintarjeta').innerHTML = paso
    ? `<b>Lo que entrenaste:</b> ${L.ense}<br><br>Reconocer cantidades sin contar se llama <b>subitización</b>. No es un talento: es un patrón que se entrena, igual que amarrarse los zapatos.`
    : `<b>Todavía no</b>, y está bien. Se aprueba con 8 de 10 para asegurar que la forma quedó, no para castigar.<br><br>Consejo: no cuentes uno por uno. Busca la agrupación — <b>${L.ense.toLowerCase()}</b>`;
  const sig = paso && S.nivel+1<NIVELES.length;
  $('#finsig').textContent = sig? 'Siguiente misión' : (paso? 'Volver a jugar' : 'Repetir misión');
  $('#finsig').onclick=()=>{ Audio_.init(); Audio_.tic();
    if(sig) empieza(S.nivel+1); else if(paso){ pintaMenu(); ir('menu'); } else empieza(S.nivel); };
  Audio_.callar();
  if(paso){ Audio_.fanfarria(); Audio_.hablar('¡Misión superada! '+a+' de diez.','ya'); }
  else { Audio_.suave(); Audio_.hablar('Casi. Lo repetimos y te sale.','ya'); }
  ir('fin');
}

/* ---------------------- CONTROLES GLOBALES ---------------------- */
$('#volver').onclick=()=>{ limpiaTimers(); Audio_.callar(); pintaMenu(); ir('menu'); };
$('#finmenu').onclick=()=>{ Audio_.callar(); pintaMenu(); ir('menu'); };
$('#son').onclick=()=>{ Audio_.on=!Audio_.on; if(!Audio_.on) Audio_.callar(); else Audio_.init();
  $('#son').textContent=Audio_.on?'🔊':'🔇'; };
document.addEventListener('touchstart',()=>Audio_.init(),{once:true});
document.addEventListener('click',()=>Audio_.init(),{once:true});
window.addEventListener('resize',()=>{ if(S.fase==='guiada'||S.fase==='modelo'){} });

Guarda.leer();
pintaMenu();
</script>
